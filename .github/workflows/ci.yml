# CI runs `make full` — the same merge decision a developer runs locally.
# There is no CI-only tier and no CI-only step list. If it is green here it is
# green there, and if it is red here the tree is red.
#
# `make full` covers the format check, go build, go vet, the tagged vet, the
# subsystem freeze greps, the changed-line lint, a compile of every _test.go
# file, `go test -short -count=1 ./...` over EVERY package, the whole-tree lint
# ceiling, the tagged scenario tier, the crash tier and the module hygiene
# checks. Real-daemon E2E tests opt out under -short (skipRealDaemonE2EInShort)
# because they need br, twin binaries and a live daemon, none of which a hosted
# runner has.
#
# Merge-blocking. Do NOT add continue-on-error: it silences the run, step and
# check-run conclusions at once, so every REST surface reports success after a
# real failure.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: make full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cache dev tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Install dev tools
        run: make tools

      - name: make full
        run: make full

