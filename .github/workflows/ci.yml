# CI runs `make full` — the same merge decision a developer runs locally.
# There is no CI-only tier and no CI-only step list. If it is green here it is
# green there, and if it is red here the tree is red.
#
# `make full` covers the format check, go build, go vet, the tagged vet, the
# subsystem freeze greps, the changed-line lint, a compile of every _test.go
# file, `go test -short -count=1 ./...` over EVERY package, the whole-tree lint
# allow list, the tagged scenario tier, the crash tier and the module hygiene
# checks. Real-daemon E2E tests opt out under -short (skipRealDaemonE2EInShort)
# because they need br, twin binaries and a live daemon, none of which a hosted
# runner has.
#
# Merge-blocking. Do NOT add continue-on-error: it silences the run, step and
# check-run conclusions at once, so every REST surface reports success after a
# real failure.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    # THIS NAME IS AN IDENTIFIER, NOT A LABEL. Branch protection on `main`
    # requires the status context `check (Tier 2)`, and a job's context IS its
    # `name:`. Rename this and nothing reports that context again — GitHub then
    # treats the required check as PENDING rather than failing, so every later
    # PR to main blocks forever on a check that cannot arrive. The gate would
    # not go green and would not go red; it would stop existing while still
    # blocking. That is what happened: an earlier commit on this branch renamed
    # the job to `make full` to match what it runs, which was true and would
    # have wedged main the moment the branch landed.
    #
    # "Tier 2" names a tier vocabulary this repo deleted. The name is stale on
    # purpose: it is the string GitHub matches, so it costs nothing to keep and
    # a merge to change. To retire it, edit branch protection and this line in
    # the same window, or main is unprotected in between.
    # A gate that holds this name and the protection setting in agreement is
    # being written; until it lands, this comment is the only thing guarding
    # the name, and a comment is not a guard.
    name: check (Tier 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cache dev tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Install dev tools
        run: make tools

      - name: make full
        run: make full

