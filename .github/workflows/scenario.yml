# Tier 3 — make test-scenario
# Builds all twin binaries then runs the scenario suite (-race, -tags=scenario, 10m).
# Covers test/scenario/... and internal/daemon/... scenario build-tag files.
# Non-merge-blocking: no required status check configured in branch protection
# (main requires only "check (Tier 2)"). So this workflow reports the truth and
# blocks nothing.
#
# EXPECT THIS TO BE RED. The suite is genuinely red, and the red is the point.
# Until 2026-07-29 this workflow reported success on every one of its last 20 real
# failures. A red run here is not a broken workflow. It is a working one.
#
# The known failures, measured 2026-07-29: 8 deterministic failures that reproduce
# in isolation, plus a family of load flakes that pass when run alone. Most of the
# 8 are stale tests, tracked as hk-97gcz. One is a real defect in the merge path,
# tracked as hk-co8g8.
#
# The runner installs br because three top-level scenarios require the real CLI.
# The Make recipe builds the twins and reports the runtime skip count. A green run
# still needs review against that count.
#
# Do NOT add this to required status checks until the 8 deterministic failures
# close. That would wedge every merge. Making the tier visible, which is what
# removing continue-on-error did, is the safe half of that change.
name: Scenario

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly at 04:00 UTC. The ops-monitor probe
    # (scripts/ops-monitor-check.sh → checks['scenario-nightly']) reads this run's
    # "make test-scenario" step conclusion. That probe was dead for as long as this
    # workflow carried continue-on-error, because the flag masked the failure on
    # the run conclusion, the step conclusion, AND the check-runs conclusion. The
    # flag is gone as of 2026-07-29, so the probe reports the truth again with no
    # change to the probe itself. (hk-plw4z, hk-21v7c)
    - cron: "0 4 * * *"

jobs:
  scenario:
    name: scenario (Tier 3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install br
        run: |
          cargo install --git https://github.com/Dicklesworthstone/beads_rust
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Do NOT add continue-on-error to this step. It hid the result on every REST
      # surface, not just the run conclusion, which is how 20 straight failures
      # read as green. Compare nightly-race.yml, which carries the same warning.
      - name: make test-scenario
        run: make test-scenario
