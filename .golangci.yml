version: "2"
run:
  timeout: 5m
  go: "1.25"
linters:
  default: none
  enable:
    # Correctness
    - errcheck        # unhandled errors — CRITICAL for agent-coded
    - govet           # stdlib correctness analyzers
    - staticcheck     # SA/ST/S correctness + simplification
    - ineffassign     # writes with no read
    - unused          # dead code (replaces deadcode/structcheck/varcheck)
    # gosimple removed: merged into `staticcheck` in golangci-lint v2 (no longer a standalone linter name)
    - errorlint       # %w wrapping + errors.Is/As correctness
    - nilerr          # returning nil when err is non-nil
    - copyloopvar     # Go 1.22+ loop var capture (redundant now, belt+suspenders)
    - testifylint     # testify misuse (wrong assertion fn, missing compare, etc.)
    - errchkjson      # ignored JSON marshal/unmarshal errors
    - exhaustive      # missing enum cases in switch statements
    # Resource / context
    - bodyclose       # http.Response.Body leaks
    - rowserrcheck    # sql.Rows.Err()
    - sqlclosecheck   # sql.Rows/Stmt close
    - contextcheck    # context.Context propagation
    - noctx           # http requests without context
    - containedctx    # context.Context stored in structs (ban)
    - fatcontext      # context.Context leaks in loops
    # Style / diagnostics
    - gocritic        # diagnostic + style bundle
    - revive          # replacement for golint; minimal ruleset
    - misspell        # typos in comments/strings
    - unparam         # always-same param values (catches dead branches)
    - unconvert       # unnecessary type conversions
    - prealloc        # slice prealloc hints
    - nakedret        # naked returns > 20 lines
    - nolintlint      # nolint directives must be justified
    - gosec           # security smells (advisory; see below)
    - forbidigo       # ban specific calls (see config)
    - depguard        # import-graph + component-layer rules (subsystem-organization.md)
    # ── Track C: complexity ceiling (ratchet via --new-from-rev; grandfathers existing) ──
    - funlen          # function length ceiling — new/changed code only
    - cyclop          # per-function cyclomatic complexity ceiling
    - gocognit        # cognitive complexity (better "hard to follow" signal than raw cyclo)
  exclusions:
    rules:
      # tools/ holds one-shot CLI utilities that print to stdout and run synchronously
      # without a broader cancellation context. forbidigo (fmt.Print*) and noctx
      # (exec.Command) bans target daemon/library code, not CLI tools.
      - path: ^tools/
        linters:
          - forbidigo
          - noctx
      # Complexity ceilings target production logic, not table-driven tests or the
      # full-stack scenario harness / self-assert audit packages.
      - path: (_test\.go$|^internal/scenario/|^internal/specaudit/)
        linters:
          - funlen
          - cyclop
          - gocognit
      # internal/testhelpers is test infrastructure invoked from *_test.go files;
      # forbidigo bans (panic) target production code paths, not assertion helpers.
      - path: ^internal/testhelpers/
        linters:
          - forbidigo
      # cmd/ is the CLI. Printing to stdout IS its output, so "use the structured
      # logger" is a false positive there by construction — it accounted for 184
      # of the tree's 235 forbidigo findings. tools/ and internal/testhelpers/
      # above are the same carve-out; this extends it to the one tree whose whole
      # job is to print.
      #
      # Deliberately NARROWER than those two: they exclude the WHOLE forbidigo
      # linter, which also hands them the `panic` ban for free. This rule matches
      # only the fmt.Print* ban (by its msg text), so `panic` stays forbidden in
      # cmd/ — a CLI that panics instead of returning an exit code is still a
      # defect, and the ban's own wording ("panics only in main/init") says so.
      - linters:
          - forbidigo
        text: 'use the structured logger'
        path: ^cmd/
      # SC6 (agent-input-substrate T9): the time.Sleep/After/NewTimer ban is
      # PATH-SCOPED to the structured input-driver packages. This rule EXCLUDES
      # the SC6-DRIVER-CLOCKPORT finding for every file EXCEPT those packages
      # (path-except), so the ban bites ONLY there — FakeClock's own spin
      # (internal/substrate) and all other code stay unaffected. Matching on the
      # SC6-DRIVER-CLOCKPORT marker leaves the fmt.Print / panic bans intact.
      - linters:
          - forbidigo
        text: 'SC6-DRIVER-CLOCKPORT'
        path-except: internal/(codexinput|codexdriver)/
      # SC6 carve-out: the ban targets the PRODUCTION driver path. Driver test
      # files legitimately poll with time.Sleep (arm-before-advance spins) and
      # backstop with time.After — those are harness plumbing, not driver timing.
      - linters:
          - forbidigo
        text: 'SC6-DRIVER-CLOCKPORT'
        path: _test\.go$
      # P2 hk-8dtiv: production Close() is now mechanically errcheck-gated (the four
      # (io.Closer|*os.File|net.Conn|net.Listener).Close exclude-functions entries were
      # dropped). Test Close noise stays at zero by matching the finding text on _test.go
      # paths — the same text:+path: mechanism the SC6 rules above use.
      - linters:
          - errcheck
        text: 'Close` is not checked'
        path: _test\.go$
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      # Close() is mechanically errcheck-gated on production code (P2 hk-8dtiv).
      # The four (io.Closer|*os.File|net.Conn|net.Listener).Close exclude-functions
      # entries that used to live here were dropped once the whole production tree
      # was migrated to the house Close idiom (see .claude/skills/agent-reviewer/
      # SKILL.md §"Deferred Close()" for the three landed forms). Test noise is
      # carried by the `_test.go`-scoped errcheck exclusion in exclusions.rules
      # above (text: 'Close` is not checked'), not by a function exclusion — so
      # every production close is checked while `*_test.go` closes stay silent.
      # There are no Close exclude-functions entries; do not re-add them.
    revive:   { rules: [{name: exported}, {name: package-comments}, {name: var-naming}, {name: error-return}, {name: error-naming}, {name: if-return}] }
    gocritic: { enabled-tags: [diagnostic, performance, style], disabled-checks: [hugeParam, rangeValCopy] }
    nolintlint: { require-explanation: true, require-specific: true, allow-unused: false }
    funlen:
      lines: 100          # 104 existing funcs exceed this — all grandfathered by --new-from-rev
      statements: 60
      ignore-comments: true
    cyclop:
      max-complexity: 15  # per-function ceiling (linter default 10; 15 = headroom for real branching)
      package-average: 0  # disabled — rely on the per-function ceiling only
    gocognit:
      min-complexity: 20  # report cognitive complexity above 20 (golangci default 30; 20 is stricter)
    forbidigo:
      forbid:
        - { pattern: '^fmt\.Print.*$', msg: "use the structured logger" }
        - { pattern: '^panic$',         msg: "return an error; panics only in main/init" }
        # SC6 (agent-input-substrate T9): the structured Codex input-driver
        # packages must take EVERY wait through the substrate ClockPort so the
        # bounded-liveness windows replay in virtual time. A literal-Sleep ban
        # alone is insufficient — the live path's blind waits are time.After in a
        # select — so time.After / time.NewTimer are banned too. These bans are
        # SCOPED to the driver packages by the SC6-DRIVER-CLOCKPORT exclusion rule
        # below (path-except), so FakeClock's own spin (internal/substrate) and
        # every other package stay unaffected.
        - { pattern: '^time\.Sleep$',    msg: "SC6-DRIVER-CLOCKPORT: driver waits go through substrate.ClockPort.Sleep, never time.Sleep" }
        - { pattern: '^time\.After$',    msg: "SC6-DRIVER-CLOCKPORT: driver waits go through substrate.ClockPort, never time.After" }
        - { pattern: '^time\.NewTimer$', msg: "SC6-DRIVER-CLOCKPORT: driver waits go through substrate.ClockPort, never time.NewTimer" }
    depguard:
      # Component-graph rules (subsystem layering) live here per subsystem-organization.md §Dependency layering enforcement.
      # One `rules.<name>` entry per component; `files:` scopes the rule, `allow:`/`deny:` set the allowed edges.
      # Full matrix is in subsystem-organization.md. Example stub:
      rules:
        # BI-002: All Beads interactions MUST route through internal/brcli (the sole adapter).
        # No other harmonik package may access Beads's SQLite file directly or link against
        # a SQLite driver for Beads access. internal/brcli and internal/testhelpers are exempt.
        #
        # The ban covers database/sql (the stdlib SQL interface) and the four most common
        # pure-Go and cgo SQLite drivers. Additional drivers should be added here if they
        # appear in go.sum. The fixture in testdata/depguard/beads_direct_access_fixture.go
        # (//go:build ignore) exists to verify this rule fires when golangci-lint is run against it.
        #
        # Rationale: specs/beads-integration.md §4.2 BI-002.
        beads-direct-access-ban:
          files:
            - "**/*.go"
            - "!**/internal/brcli/**"
            - "!**/internal/testhelpers/**"
          deny:
            - { pkg: "database/sql", desc: "BI-002: Beads access must route through internal/brcli; direct SQL access is forbidden (specs/beads-integration.md §4.2)" }
            - { pkg: "github.com/mattn/go-sqlite3", desc: "BI-002: Beads SQLite driver must not be linked outside internal/brcli (specs/beads-integration.md §4.2)" }
            - { pkg: "modernc.org/sqlite", desc: "BI-002: Beads SQLite driver must not be linked outside internal/brcli (specs/beads-integration.md §4.2)" }
            - { pkg: "crawshaw.io/sqlite", desc: "BI-002: Beads SQLite driver must not be linked outside internal/brcli (specs/beads-integration.md §4.2)" }
            - { pkg: "zombiezen.com/go/sqlite", desc: "BI-002: Beads SQLite driver must not be linked outside internal/brcli (specs/beads-integration.md §4.2)" }

        # PL-INV-002: the daemon binary MUST NOT import any LLM SDK in its transitive closure.
        # At MVH no packages exist yet, so this is encoded as a global deny rule covering all source files.
        # When cmd/harmonik/ and internal/daemon/ land, narrow this rule to those file trees
        # and remove the global catch-all (or keep both for belt-and-suspenders).
        # Rationale: specs/process-lifecycle.md §PL-INV-002, §PL-018, architecture.md §4.2.
        llm-sdk-ban:
          files: ["**/*.go"]
          deny:
            - { pkg: "github.com/anthropics/", desc: "PL-INV-002: daemon must not import any LLM SDK" }
            - { pkg: "github.com/openai/", desc: "PL-INV-002: daemon must not import any LLM SDK" }
            - { pkg: "github.com/sashabaranov/go-openai", desc: "PL-INV-002: daemon must not import any LLM SDK" }
            - { pkg: "github.com/liushuangls/go-anthropic", desc: "PL-INV-002: daemon must not import any LLM SDK" }
  
        # crew: stdlib + core + self-import (external test pattern); MUST NOT import daemon.
        # The crew registry is a leaf durable-state package read by daemon and CLI.
        # Rationale: docs/plans/captain/05-specs/c2-spec.md §3.3; bead hk-i1ue4.
        crew:
          files: ["**/internal/crew/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/crew"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "crew MUST NOT import daemon (c2-spec.md §3.3)" }

        # gitprobe: stdlib + the tmux CommandRunner seam + self-import (external test
        # pattern); MUST NOT import daemon. The read-only git probes live here so the
        # extracted harness packages (P2 unit E1a onward) can reach them without
        # linking the daemon — which is the whole point of the extraction. If this
        # package ever imports daemon, the harness closure silently drags the monolith
        # back in and E1's "linkable unit" property is lost.
        # Rationale: plans/2026-07-21-p2-extraction/_plan.md unit E1a.
        gitprobe:
          files: ["**/internal/gitprobe/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/lifecycle/tmux"
            - "github.com/gregberns/harmonik/internal/gitprobe"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "gitprobe is a leaf: importing daemon would re-couple every harness that uses it (P2 E1a)" }

        # projectconfig: the .harmonik/config.yaml loader + config value types
        # extracted out of internal/daemon (P2 LIFT crit 5). It is a pure leaf —
        # parseProjectConfig is the pure boundary, LoadProjectConfig the one edge
        # (os.ReadFile + UserHomeDir) — so RunEnv.ProjectCfg / RunEnv.SandboxCfg
        # can become daemon-free types and the run machine can later move to
        # internal/runloop without dragging config across the boundary. The allow
        # list is the MEASURED import set: stdlib, yaml.v3 (the on-disk decoder),
        # internal/core (AgentType / WorkflowMode), and self (white-box tests).
        # It MUST NOT import daemon: doing so would re-couple every daemon file
        # that names a config type back through the leaf and defeat the extraction.
        # Rationale: plans/2026-07-21-p2-extraction LIFT crit 5.
        projectconfig:
          files: ["**/internal/projectconfig/**"]
          allow:
            - "$gostd"
            - "gopkg.in/yaml.v3"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/projectconfig"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "projectconfig is a leaf: importing daemon would re-couple the config value types to the monolith (P2 LIFT crit 5)" }

        # runloop: the run machine's boundary contract — the narrow structural
        # PORT interfaces (LedgerPort … RunRegistryPort) and the value/handle
        # BUNDLES (RunEnv, RunPorts, SharedHandles) the run path consumes. This is
        # the P2 LIFT foundation (chunk L0): the run-path FILES still live in
        # internal/daemon and move here over chunks L1–L9; L0 lifts only the shared
        # port surface so those moves are pure git mv's onto a package that already
        # compiles daemon-free. The daemon → runloop edge is the ONLY legal one:
        # the concrete adapters (daemonLedger, daemonRunRegistry, …) stay in daemon
        # and satisfy these interfaces, so a runloop → daemon edge would invert the
        # extraction and re-couple the ports to the monolith — the deny below IS the
        # unit's success criterion in CI. The allow list is the MEASURED direct
        # import set of internal/runloop/ports.go (via `go list`), nothing
        # speculative: stdlib; internal/core; internal/projectconfig (RunEnv.
        # ProjectCfg / SandboxCfg); internal/substrate (RunPorts.Clock ClockPort);
        # internal/brcli (BeadLedger method sigs + RunEnv.BrTimeoutCfg);
        # internal/handler + internal/handlercontract (the prefix covers
        # handlercontract/lifecycle, whose hclifecycle.Machine RunHandlePort.
        # SetMachine names) for the launch/emitter/substrate surfaces;
        # internal/harness/shared (LaunchPort's LaunchCtx / LaunchArtifacts);
        # internal/lifecycle/tmux (SharedHandles.Runner CommandRunner);
        # internal/runmerge (MergePort.Submit); internal/workers
        # (SharedHandles.Workers); google/uuid (PerRunEventTap synthetic event
        # IDs); and self (white-box tests). depguard allow
        # entries are PREFIX matches. NOTE: internal/runlaunch is DELIBERATELY
        # absent — ports.go does not import it at L0; later chunks that move
        # run-path files widen this list as the compiler demands.
        # Rationale: plans/2026-07-21-p2-extraction/DAEMON-PARALLEL-ROADMAP.md (LIFT L0).
        runloop:
          files: ["**/internal/runloop/**"]
          allow:
            - "$gostd"
            - "github.com/google/uuid"
            - "github.com/gregberns/harmonik/internal/brcli"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/handler"
            - "github.com/gregberns/harmonik/internal/handlercontract"
            - "github.com/gregberns/harmonik/internal/harness/shared"
            - "github.com/gregberns/harmonik/internal/lifecycle/tmux"
            - "github.com/gregberns/harmonik/internal/projectconfig"
            - "github.com/gregberns/harmonik/internal/runloop"
            - "github.com/gregberns/harmonik/internal/runmerge"
            - "github.com/gregberns/harmonik/internal/substrate"
            - "github.com/gregberns/harmonik/internal/workers"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "runloop is a leaf: the run machine's ports must not import daemon back — the concrete adapters live in daemon and satisfy these interfaces (daemon → runloop is the only legal edge; P2 LIFT L0)" }

        # harness-shared: the cross-harness leaf (P2 unit E1a-0). Holds the pieces
        # that more than one harness implementation needs and none of them owns:
        # the resume seed prompt (seedprompt.go), the Refs:<bead> trailer
        # machinery (refstrailer.go, shared by codex and pi — picommit.go's
        # piRefsOutcome is literally an alias of it) and the launch-spec env-key
        # split (env.go). It may reach the same seam leaves the harness impls
        # reach, and NOTHING else: not the daemon, and not any concrete harness.
        # Allowing a harness edge here would turn the leaf into a hub and
        # re-couple pi to codex through the back door — the exact coupling this
        # split removed. Note this is a PER-PACKAGE rule, not a blanket
        # **/internal/harness/** one: a single rule whose allow list named both
        # shared and codex would silently permit shared -> codex.
        # Rationale: plans/2026-07-21-p2-extraction/E1a-codex-harness.md §5.
        harness-shared:
          files: ["**/internal/harness/shared/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/handlercontract"
            - "github.com/gregberns/harmonik/internal/lifecycle/tmux"
            - "github.com/gregberns/harmonik/internal/harness/shared"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "harness/shared MUST NOT import daemon — the container links the harness, not the monolith (P2 E1a)" }
            - { pkg: "github.com/gregberns/harmonik/internal/harness/codex", desc: "harness/shared is a leaf BELOW every harness impl; a codex edge re-couples pi to codex (P2 E1a)" }
            - { pkg: "github.com/gregberns/harmonik/internal/harness/claude", desc: "harness/shared is a leaf BELOW every harness impl (P2 E1b)" }
            - { pkg: "github.com/gregberns/harmonik/internal/harness/pi", desc: "harness/shared is a leaf BELOW every harness impl (P2 E1c)" }

        # harness-codex: the codex harness implementation, lifted out of
        # internal/daemon by P2 unit E1a-1. The rule is PRE-ARMED here in E1a-0 —
        # it matches nothing today — so the brake exists before the mass arrives
        # and the move cannot land unfenced. Its whole point is that a P3
        # container can link THIS package without dragging the 57k-LOC daemon in
        # with it, so the deny edge below is the unit's success criterion
        # expressed in CI: if it ever goes green while codex imports daemon, the
        # extraction has been silently undone. The allow list is the verified
        # import set of the seven files E1a-1 moves — nothing speculative. A
        # denied import is a FINDING: prove the dependency belongs before
        # widening this list.
        # Rationale: plans/2026-07-21-p2-extraction/E1a-codex-harness.md §5.
        harness-codex:
          files: ["**/internal/harness/codex/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/handler"
            - "github.com/gregberns/harmonik/internal/handlercontract"
            - "github.com/gregberns/harmonik/internal/gitprobe"
            - "github.com/gregberns/harmonik/internal/lifecycle/tmux"
            - "github.com/gregberns/harmonik/internal/harness/shared"
            - "github.com/gregberns/harmonik/internal/harness/codex"
            - "github.com/google/uuid"
            - "gopkg.in/yaml.v3"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "harness impls MUST NOT import daemon back — the container links the harness, not the monolith (P2 E1a)" }

        # harness-claude: the Claude Code harness implementation, lifted out of
        # internal/daemon by P2 unit E1b — the launch-spec builder that threads
        # the claude-hook-bridge pieces together, plus the
        # handlercontract.Harness adapter over it. Same success criterion as
        # harness-codex: a P3 container must be able to link THIS package
        # without dragging the 57k-LOC daemon in with it, so the deny edge below
        # IS the unit expressed in CI — if it ever goes green while claude
        # imports daemon, the extraction has been silently undone.
        #
        # This list is WIDER than harness-codex by exactly one entry:
        # internal/workspace. Claude is the only harness that materializes
        # per-launch worktree state (.claude/settings.json, the ~/.claude.json
        # trust + theme upserts, the isolated remote config dir, agent-task.md).
        # That edge is an IMPL dependency and is deliberately NOT granted to
        # internal/harness/shared — a helper that needs workspace is not shared,
        # it belongs to one impl.
        #
        # A denied import is a FINDING: prove the dependency belongs before
        # widening this list.
        # Rationale: plans/2026-07-21-p2-extraction/E1b-claude.md §5.1.
        harness-claude:
          files: ["**/internal/harness/claude/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/handler"
            - "github.com/gregberns/harmonik/internal/handlercontract"
            - "github.com/gregberns/harmonik/internal/workspace"
            - "github.com/gregberns/harmonik/internal/lifecycle/tmux"
            - "github.com/gregberns/harmonik/internal/harness/shared"
            - "github.com/gregberns/harmonik/internal/harness/claude"
            - "github.com/google/uuid"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "harness impls MUST NOT import daemon back — the container links the harness, not the monolith (P2 E1b)" }
            - { pkg: "github.com/gregberns/harmonik/internal/harness/codex", desc: "a harness impl MUST NOT import a sibling impl; cross-harness helpers belong in internal/harness/shared (P2 E1b)" }
            - { pkg: "github.com/gregberns/harmonik/internal/harness/pi", desc: "a harness impl MUST NOT import a sibling impl; cross-harness helpers belong in internal/harness/shared (P2 E1b)" }

        # harness-pi: the Pi harness implementation, lifted out of internal/daemon
        # by P2 unit E1c — the argv/env launch-spec builder (PI-015/020/021 plus
        # the base_url models.json passthrough), the NDJSON parser and
        # session-id/agent_end interceptor, the fail-closed PI-040 billing guard,
        # and the PI-030/031 Refs:<bead> trailer fallback. Same success criterion
        # as harness-codex and harness-claude: a P3 container must be able to
        # link THIS package without dragging the 57k-LOC daemon in with it, so
        # the daemon deny below IS the unit expressed in CI.
        #
        # The SIBLING denies matter as much as the daemon one here, and this is
        # the unit that made them load-bearing: five of pi's six outbound symbols
        # used to live in codexcommit.go, so before E1a-0 split them into
        # internal/harness/shared a pi -> codex edge was the natural shape. It is
        # a daemon back-edge in disguise (_plan.md §6) and must stay denied.
        # This is also why these are PER-PACKAGE rules and not one umbrella
        # **/internal/harness/** rule: depguard allow entries are PREFIX matches,
        # so a single allow of .../internal/harness would silently permit every
        # sibling edge it is the point of these rules to forbid.
        #
        # The allow list is the verified import set of the five files E1c moves
        # plus its test files — nothing speculative. A denied import is a
        # FINDING: prove the dependency belongs before widening this list.
        # Rationale: plans/2026-07-21-p2-extraction/E1c-pi.md §5.1.
        harness-pi:
          files: ["**/internal/harness/pi/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/handler"
            - "github.com/gregberns/harmonik/internal/handlercontract"
            - "github.com/gregberns/harmonik/internal/gitprobe"
            - "github.com/gregberns/harmonik/internal/lifecycle/tmux"
            - "github.com/gregberns/harmonik/internal/harness/shared"
            - "github.com/gregberns/harmonik/internal/harness/pi"
            - "github.com/google/uuid"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "harness impls MUST NOT import daemon back — the container links the harness, not the monolith (P2 E1c)" }
            - { pkg: "github.com/gregberns/harmonik/internal/harness/codex", desc: "a harness impl MUST NOT import a sibling impl; cross-harness helpers belong in internal/harness/shared (P2 E1c)" }
            - { pkg: "github.com/gregberns/harmonik/internal/harness/claude", desc: "a harness impl MUST NOT import a sibling impl; cross-harness helpers belong in internal/harness/shared (P2 E1c)" }

        # transport: the remote-execution transport leaves (P2 unit E4). tunnel owns
        # the per-run `ssh -N -R` reverse tunnel + its readiness gate; codesync owns
        # the DD1 worker<->box-A git sync (fetch-base on the worker, direct ssh://
        # fetch of the run branch back to box A). Both sit BEHIND the pre-existing
        # lifecycle/tmux.CommandRunner seam (runner.go:16) and address workers via
        # internal/workers. They MUST NOT import daemon:
        # P3's remote/container dispatch links this transport, and a daemon
        # back-edge would drag the 57k-LOC monolith into every dispatcher — exactly
        # the coupling E4 exists to remove. Note the self-allow is the
        # "internal/transport" PREFIX, which does not collide with the daemon deny,
        # so sub-packages and their external _test packages resolve cleanly.
        # CAVEAT: depguard only checks DIRECT imports. internal/workers,
        # internal/workspace and internal/lifecycle/tmux are verified daemon-free
        # today (workspace's own allow-list below has no daemon entry, so a daemon
        # import there is itself a lint failure); if one ever grows a daemon import
        # this rule will NOT fire. The transitive check is
        # `go list -deps ./internal/transport/... | grep internal/daemon`.
        # internal/workspace: codesync needs workspace.TaskBranchName to form the
        # run-branch refspec (E4b).
        # Rationale: plans/2026-07-21-p2-extraction/E4-ssh.md slices E4a, E4b.
        transport:
          files: ["**/internal/transport/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/lifecycle/tmux"
            - "github.com/gregberns/harmonik/internal/workers"
            - "github.com/gregberns/harmonik/internal/workspace"
            - "github.com/gregberns/harmonik/internal/transport"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "transport is a leaf: importing daemon would re-couple every remote dispatcher to the monolith (P2 E4)" }

        # workers: worker addressing, selection/slot tracking, health probing,
        # telemetry — and, since P2 unit E4c, the BOOT WIRING that turns a loaded
        # workers.Config into a live *Registry (BuildRegistry / BootHealthRunner,
        # bootwire.go, lifted out of internal/daemon/workloop.go). This rule is the
        # fence that makes that lift stick: workers is a LEAF that internal/daemon,
        # internal/transport and a P3 remote dispatcher all sit above, so a daemon
        # import here would invert the direction of the whole extraction.
        # The allow list is the MEASURED import set — core, lifecycle/tmux, the
        # self-import used by the package's workers_test external tests, yaml for
        # decoding workers.yaml (workers.go), and rapid for routing_prop_test.go.
        # It is deliberately NARROW: handlercontract is
        # absent on purpose, which is the whole reason BuildRegistry takes this
        # package's own workers.EmitFunc instead of a handlercontract.EventEmitter.
        # Widening it needs proof, not convenience.
        # Rationale: plans/2026-07-21-p2-extraction/E4-ssh.md slice E4c.
        workers:
          files: ["**/internal/workers/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/lifecycle/tmux"
            - "github.com/gregberns/harmonik/internal/workers"
            - "gopkg.in/yaml.v3"
            - "pgregory.net/rapid"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "workers is a leaf BELOW daemon and transport; a daemon edge would invert the P2 E4c boot-wire extraction" }

        # keeper: stdlib + core + eventbus + presence + self-import (external test
        # pattern); MUST NOT import daemon or workloop.
        # presence: the hitl-decisions K5 orphan reaper (presence.ReapOrphanedDecisions)
        # runs on the keeper watch tick (watcher.go); internal/presence is the leaf
        # that owns the open-decision projection + the Offline presence predicate +
        # the reaper, so the keeper tick imports it without importing daemon
        # (hitl-decisions SPEC §5 / N9; bead hk-061).
        # Rationale: codename:session-keeper (hk-ekap1); bead hk-fzzc6, hk-061.
        keeper:
          files: ["**/internal/keeper/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/eventbus"
            - "github.com/gregberns/harmonik/internal/presence"
            - "github.com/gregberns/harmonik/internal/keeper"
            - "github.com/gregberns/harmonik/internal/dashboard"
            - "github.com/gregberns/harmonik/internal/digest"
            # substrate: the ClockPort determinism seam (D4/SK-008/SK-R3). The
            # cycle core reads time exclusively through substrate.ClockPort so a
            # FakeClock can replay timeouts. substrate is a stdlib-only leaf; this
            # edge is the intended keeper→substrate consumer direction (the
            # reverse is denied by the substrate leaf rule). Rationale: T5.
            - "github.com/gregberns/harmonik/internal/substrate"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "keeper MUST NOT import daemon (session-keeper spec hk-ekap1)" }
            - { pkg: "github.com/gregberns/harmonik/internal/workloop", desc: "keeper MUST NOT import workloop (session-keeper spec hk-ekap1)" }

        # Leaf: internal/core must not import any sibling subsystem.
        # In depguard v2 a deny-only rule defaults to stdlib-only; we must list
        # the narrow set of external deps core is permitted to use.
        core:
          files: ["**/internal/core/**"]
          allow:
            - "$gostd"
            - "github.com/google/uuid"
            - "pgregory.net/rapid"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/", desc: "core is a leaf; no subsystem imports" }
  
        # Queue production code imports core plus UUID for queue/event identity.
        # External tests also need the self-import used by package queue_test.
        # eventbus import added by T12 (hk-hn363) when queue-lifecycle events are
        # wired. Spec ref: specs/queue-model.md §1.
        queue:
          files: ["**/internal/queue/**"]
          allow:
            - "$gostd"
            - "github.com/google/uuid"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/queue"

        # queuewiring: the daemon-side queue OWNERSHIP + operator-transition wiring
        # extracted out of internal/daemon (P2 unit E3a). The queue ENGINE is already a
        # clean leaf (internal/queue); this package holds the in-memory QueueStore that
        # satisfies queue.QueueSetter / queue.LockedQueueView / queue.MutationLocker, the
        # brcli -> queue.BeadLedger bridge, and the operator pause/resume consumer. The
        # daemon is the composition root and injects these; it MUST NOT be imported back,
        # or the queue control surface silently re-couples to the 56k-LOC monolith.
        # uuid + testify are needed by the moved external test files (depguard `files:`
        # globs match _test.go too); the self-import row is the external-test-package
        # pattern (queuewiring_test importing queuewiring). Note the `internal/queue` row
        # is a PREFIX match and so already covers `internal/queuewiring` (see the
        # bootconfig rule's comment below) — the explicit self-row is kept so the list
        # stays correct if `internal/queue` is ever tightened to an exact match.
        # CAVEAT: depguard checks DIRECT imports only. internal/{core,queue,eventbus,brcli}
        # are verified daemon-free today; the transitive check is
        # `go list -deps ./internal/queuewiring | grep internal/daemon`.
        # Rationale: plans/2026-07-21-p2-extraction/E3-queue-wiring.md slice E3a.
        queuewiring:
          files: ["**/internal/queuewiring/**"]
          allow:
            - "$gostd"
            - "github.com/google/uuid"
            - "github.com/stretchr/testify/require"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/queue"
            - "github.com/gregberns/harmonik/internal/eventbus"
            - "github.com/gregberns/harmonik/internal/brcli"
            - "github.com/gregberns/harmonik/internal/queuewiring"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "queuewiring is the extracted queue-ownership layer; daemon composes it, never the reverse (P2 E3)" }

        # crewrun: the daemon-side crew launch contract — crew-start/crew-stop RPC
        # payloads, the persistent-session launch-spec builder, the crew-scoped
        # harness resolver, the mission front-matter readers, and the idle-crew
        # reaper — extracted from internal/daemon behind the already-fenced
        # internal/crew registry leaf and the handler.LaunchSpec value type
        # (P2 unit E2, slice E2a). The daemon composition root threads the queue
        # lookup and the crew stopper IN. crewrun MUST NOT import daemon back —
        # that back-edge re-links the ~57k-LOC monolith into the crew launch path
        # and voids the extraction.
        # internal/daemon/crewstart.go (the tmux-native crew-start handler) is the
        # ONE sanctioned residue: it type-asserts substrateWithAdapter, whose only
        # method tmuxAdapter() is unexported and therefore package-qualified, so the
        # assertion cannot be written outside internal/daemon. Moving it is slice
        # E2b, which needs an operator waiver of the no-new-seam rule.
        # CAVEAT: depguard checks DIRECT imports only. internal/{crew,handler,queue}
        # are verified daemon-free today; the transitive check is
        # `go list -deps ./internal/crewrun | grep internal/daemon`.
        # Rationale: plans/2026-07-21-p2-extraction/E2-crew.md slice E2a.
        crewrun:
          files: ["**/internal/crewrun/**"]
          allow:
            - "$gostd"
            - "gopkg.in/yaml.v3"
            - "github.com/gregberns/harmonik/internal/crew"
            - "github.com/gregberns/harmonik/internal/handler"
            - "github.com/gregberns/harmonik/internal/queue"
            - "github.com/gregberns/harmonik/internal/crewrun"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "crewrun is a leaf behind the crew-registry + handler.LaunchSpec seams; importing daemon back voids P2 E2" }

        # socketrouter: the pure protocol dispatch table (giant-retirement follow-up), a daemon
        # sub-package. Value-in/value-out routing: Classify + Router.Dispatch + neutral Result over
        # json.RawMessage. The daemon threads effectful handler closures IN (mergeq/runexec pattern);
        # the router MUST NOT import daemon back. Tighter than orchestrator/policy — no core, no net
        # (ops are strings, payloads are json.RawMessage, no conn on the edge).
        socketrouter:
          files: ["**/internal/daemon/router/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/daemon/router"   # self-import (external test pattern)
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "router is a pure daemon sub-package; daemon threads handler closures in, never the reverse (import-cycle caveat)" }

        # schedule: generic recurring-job primitive (codename:schedule, hk-0es).
        # Pure types + next-fire clock + durable single-writer store. Leaf:
        # stdlib + core + self-import (action execution + the work-loop tick live
        # in internal/daemon, which imports this package).
        # core: the store creates .harmonik/ lazily and needs core.HarmonikDirMode
        # — os.MkdirAll does NOT chmod an existing directory, so a package that
        # hardcodes its own mode leaves the result dependent on which package
        # created the tree first (internal/core/harmonikdirmode.go). core is the
        # universal leaf and imports nothing back, so no cycle is possible.
        # MUST NOT import daemon. Spec ref: hk-0es brief (operator-locked D1/D2).
        schedule:
          files: ["**/internal/schedule/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/schedule"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "schedule MUST NOT import daemon (hk-0es: leaf primitive)" }

        # substrate: generic record→replay seam (codename:session-restart-substrate).
        # Leaf: stdlib + self-import only. Verticals instantiate substrate, never the
        # reverse. MUST NOT import a vertical (codex, keeper) or the daemon.
        # Rationale: specs/replay-substrate.md §RS-005; substrate-design.md §1.3.
        substrate:
          files: ["**/internal/substrate/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/substrate"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/codexreactor", desc: "substrate MUST NOT import a vertical (codex)" }
            - { pkg: "github.com/gregberns/harmonik/internal/codexwire", desc: "substrate MUST NOT import a vertical (codex)" }
            - { pkg: "github.com/gregberns/harmonik/internal/codexdigitaltwin", desc: "substrate MUST NOT import a vertical (codex)" }
            - { pkg: "github.com/gregberns/harmonik/internal/keeper", desc: "substrate MUST NOT import a vertical (keeper)" }
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "substrate MUST NOT import daemon" }

        # codex vertical: reactor + digital twin instantiate the substrate seam.
        # Companion rule pinning the "verticals depend on substrate, never
        # sideways or on the daemon" invariant (codename:session-restart-substrate).
        # Allow: stdlib + substrate + the codex sibling packages (codexwire/
        # codexreactor). Deny: daemon and the keeper vertical.
        # Rationale: specs/replay-substrate.md §RS-005; substrate-design.md §1.3.
        codex-vertical:
          files: ["**/internal/codexreactor/**", "**/internal/codexdigitaltwin/**", "**/internal/codexinput/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/substrate"
            - "github.com/gregberns/harmonik/internal/codexwire"
            - "github.com/gregberns/harmonik/internal/codexreactor"
            - "github.com/gregberns/harmonik/internal/codexdigitaltwin"
            - "github.com/gregberns/harmonik/internal/codexinput"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "codex vertical MUST NOT import daemon" }
            - { pkg: "github.com/gregberns/harmonik/internal/keeper", desc: "codex vertical MUST NOT import a sibling vertical (keeper)" }
            # SC6 (agent-input-substrate T9): the structured input reactor is on
            # the direct-stdio input path (AIS-009); it MUST NEVER re-import the
            # tmux write verbs. This mirrors the codexdriver→tmux deny below.
            - { pkg: "github.com/gregberns/harmonik/internal/lifecycle/tmux", desc: "codex input path MUST NOT import tmux (AIS-009: the driver owns child stdio; tmux is not on the structured input path)" }

        # codexdriver: the structured Codex app-server driver — the second
        # handler.Substrate implementation (agent-input-substrate T6,
        # codename:agent-input-substrate). The driver shell may import handler
        # (the Substrate/InputPort seam it implements), apptap (the capture
        # tee), substrate (ClockPort + Run), and the codex vertical siblings
        # (codexwire codec + codexinput reactor). It MUST NEVER import
        # internal/lifecycle/tmux (AIS-009/AIS-010: tmux is not on the
        # structured input path — the AIS-016 CommandRunner seam is declared
        # locally) or daemon.
        codexdriver:
          files: ["**/internal/codexdriver/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/substrate"
            - "github.com/gregberns/harmonik/internal/codexwire"
            - "github.com/gregberns/harmonik/internal/codexinput"
            - "github.com/gregberns/harmonik/internal/codexdriver"
            - "github.com/gregberns/harmonik/internal/apptap"
            - "github.com/gregberns/harmonik/internal/handler"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/lifecycle/tmux", desc: "codexdriver MUST NOT import tmux (AIS-009: the driver owns the child stdio; tmux is not on the structured input path)" }
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "codexdriver MUST NOT import daemon (composition root injects, never the reverse)" }

        # sessioncapture: the CONSUMER side of the capture tee (agent-input-
        # substrate T7, codename:agent-input-substrate; AIS-014). The apptap tee
        # owns no file format (RS-016); this package is the caller-supplied
        # writer that does persistence + HC-032 OUTPUT scrub + keep-N/age-prune
        # retention + the mechanical CAPTURE-LOG ledger. It may import substrate
        # (ClockPort for the age-prune cutoff, RS-015), core, and self only. It
        # MUST NEVER import daemon (composition root injects, never the reverse),
        # the codex vertical, or tmux.
        # core: it creates .harmonik/sessions/ lazily and needs
        # core.HarmonikDirMode for the same reason schedule does — os.MkdirAll
        # does NOT chmod an existing directory, so a private mode constant makes
        # the result depend on creation order (internal/core/harmonikdirmode.go).
        # core is the universal leaf and imports nothing back; no cycle.
        sessioncapture:
          files: ["**/internal/sessioncapture/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/substrate"
            - "github.com/gregberns/harmonik/internal/sessioncapture"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "sessioncapture MUST NOT import daemon (composition root injects the capture sink, never the reverse)" }
            - { pkg: "github.com/gregberns/harmonik/internal/codexdriver", desc: "sessioncapture is the driver's consumer, not its dependency (no import cycle)" }
            - { pkg: "github.com/gregberns/harmonik/internal/lifecycle/tmux", desc: "sessioncapture MUST NOT import tmux" }

        # keepertwin: the keeper vertical's trace-driven digital twin (T9,
        # codename:session-restart-substrate; measurement-design §2). Synthesizes
        # input-event schedules from the recorded corpus goldens and replays them
        # through the generic substrate Twin into the pure keeper reactor.
        # Allow: stdlib + substrate + keeper + core + self (external test pattern).
        # Deny: daemon and the codex vertical.
        keepertwin:
          files: ["**/internal/keepertwin/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/substrate"
            - "github.com/gregberns/harmonik/internal/keeper"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/keepertwin"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "keepertwin MUST NOT import daemon (offline twin)" }
            - { pkg: "github.com/gregberns/harmonik/internal/codexreactor", desc: "keepertwin MUST NOT import a sibling vertical (codex)" }
            - { pkg: "github.com/gregberns/harmonik/internal/codexdigitaltwin", desc: "keepertwin MUST NOT import a sibling vertical (codex)" }

        # keepertest: the keeper vertical's L0–L3 replay test tiers (T10,
        # codename:session-restart-substrate; measurement-design §3; RS-017/018).
        # Test-only package (external keepertest_test): corpus goldens → keepertwin
        # Twin → pure keeper reactor → substrate doubles / bridge sink, with the
        # recorded stream decoded via internal/replay. Zero-token, offline.
        # Deny: daemon and the codex vertical.
        keepertest:
          files: ["**/internal/keepertest/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/substrate"
            - "github.com/gregberns/harmonik/internal/keeper"
            - "github.com/gregberns/harmonik/internal/keepertwin"
            - "github.com/gregberns/harmonik/internal/replay"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/google/uuid"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "keepertest MUST NOT import daemon (zero-token offline tiers)" }
            - { pkg: "github.com/gregberns/harmonik/internal/codexreactor", desc: "keepertest MUST NOT import a sibling vertical (codex)" }
            - { pkg: "github.com/gregberns/harmonik/internal/codexdigitaltwin", desc: "keepertest MUST NOT import a sibling vertical (codex)" }

        # runexectest: the run-state-machine L2 fault-matrix + relaunch-oracle
        # tiers (RT11, codename:run-state-machine; RSM-030). Test-only package
        # (external runexectest_test), mirroring keepertest: corpus summaries →
        # replay.StimulusSynthesizer schedules → substrate.Twin → the pure
        # runexec reactors under FakeClock virtual time. Zero-token, offline.
        # Deny: daemon (RSM-028 stays intact — the tiers exercise the reactors,
        # never the shell) and the verticals.
        runexectest:
          files: ["**/internal/runexectest/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/substrate"
            - "github.com/gregberns/harmonik/internal/runexec"
            - "github.com/gregberns/harmonik/internal/replay"
            - "github.com/gregberns/harmonik/internal/core"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "runexectest MUST NOT import daemon (zero-token offline tiers; RSM-028)" }
            - { pkg: "github.com/gregberns/harmonik/internal/keeper", desc: "runexectest MUST NOT import a sibling vertical (keeper)" }
            - { pkg: "github.com/gregberns/harmonik/internal/codexreactor", desc: "runexectest MUST NOT import a sibling vertical (codex)" }

        # replay: the session-restart invariant-checking harness (codename:session-restart-substrate).
        # Reads a recorded events.jsonl via eventbus.ScanAfter and decodes through the typed
        # core registry (DispatchObservational / DecodePayloadStrict). Allowed edges: stdlib +
        # core + eventbus + uuid + self-import (external test pattern). MUST NOT import a vertical
        # (keeper) or the daemon — it is an offline consumer, not part of the live pipeline.
        # Rationale: events-design.md §4 (EV-U3/EV-048); decisions D6.
        replay:
          files: ["**/internal/replay/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/eventbus"
            - "github.com/gregberns/harmonik/internal/replay"
            - "github.com/google/uuid"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/keeper", desc: "replay MUST NOT import a vertical (keeper); it reads the recorded log offline" }
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "replay MUST NOT import daemon (offline consumer)" }

        # agentmanifest: leaf package loading .harmonik/agents/<type>/manifest.yaml.
        # Depends only on stdlib + yaml.v3. Self-import for external test pattern.
        agentmanifest:
          files: ["**/internal/agentmanifest/**"]
          allow:
            - "$gostd"
            - "gopkg.in/yaml.v3"
            - "github.com/gregberns/harmonik/internal/agentmanifest"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "agentmanifest MUST NOT import daemon (leaf primitive)" }

        # BI-004: The handler subsystem MUST NOT import internal/brcli.
        # The daemon invokes br directly (as a subprocess via the brcli adapter);
        # agents invoke br only through the Beads-CLI skill injected at launch time
        # per handler-contract.md §4.11. Neither the handler launch path nor the
        # handler-contract package may short-circuit that discipline by importing
        # the brcli adapter directly.
        #
        # Scope: internal/handler and internal/handlercontract.
        # Both packages are part of the handler subsystem (skill-injection seam).
        # The structural guard in internal/handler/bi004_handler_gate_test.go is
        # the belt-and-suspenders runtime check; this rule is the primary static
        # enforcement surface.
        #
        # Rationale: specs/beads-integration.md §4.2 BI-004.
        handler-brcli-ban:
          files:
            - "**/internal/handler/**"
            - "**/internal/handlercontract/**"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/brcli", desc: "BI-004: handler MUST NOT import brcli; agents access br only via the Beads-CLI skill per handler-contract.md §4.11 (specs/beads-integration.md §4.2)" }

        # handler↛tmux: the machine-enforced seam inversion (HC-071 / AIS-002).
        # internal/handler DECLARES the InputPort seam (SubmitInput / CloseInput);
        # the concrete input driver — the interim tmux/paste implementation and the
        # future structured Codex driver — is SUPPLIED daemon-side. internal/handler
        # therefore MUST NOT import internal/lifecycle/tmux; this replaces the former
        # doc-comment-only "boundary" (internal/handler/substrate.go) with a real,
        # machine-checkable deny, landed with the port.
        #
        # Rationale: specs/handler-contract.md §4.1a HC-071; specs/agent-input.md §4.1 AIS-002.
        handler-tmux-ban:
          files:
            - "**/internal/handler/**"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/lifecycle/tmux", desc: "HC-071/AIS-002: internal/handler declares the InputPort seam; the tmux driver is supplied daemon-side — handler MUST NOT import internal/lifecycle/tmux (specs/handler-contract.md §4.1a, specs/agent-input.md §4.1)" }

        # lifecycle/tmux: may import internal/core, internal/lifecycle (provenance),
        # and stdlib only. No other harmonik subsystem imports are permitted.
        # Rationale: process-lifecycle.md §4.5 PL-021b, PL-021c; workspace-model.md §4.1 WM-002a.
        lifecycle-tmux:
          files: ["**/internal/lifecycle/tmux/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/lifecycle"

        # eventbus / policy / handler-contract: may import core only.
        # Self-imports (internal/eventbus) are required for _test.go files in the
        # same module that import the package under test.
        eventbus:
          files: ["**/internal/eventbus/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/eventbus"
            - "github.com/google/uuid"
        policy:
          files: ["**/internal/policy/**"]
          allow: ["$gostd", "github.com/gregberns/harmonik/internal/core"]
        # presence: core + eventbus + self-import (external test pattern).
        # Leaf package owning the agent-presence projection (lifted from
        # cmd/harmonik/comms.go) AND the hitl-decisions open-decision projection +
        # orphan reaper (lifted from internal/daemon), so internal/keeper can import
        # it for the K5 keeper-tick reaper without importing internal/daemon.
        # MUST NOT import daemon. Spec ref: hitl-decisions SPEC §5 / N9; bead hk-061.
        presence:
          files: ["**/internal/presence/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/eventbus"
            - "github.com/gregberns/harmonik/internal/presence"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "presence is a leaf; MUST NOT import daemon (hitl-decisions hk-061)" }
        # handler-contract: core + uuid (sessionid.go) + self-import (external test pattern).
        # uuid is a leaf utility needed by sessionid.go (NewSessionID) and test fixtures.
        # Self-import allows the standard Go external test pattern (package handlercontract_test).
        # No other subsystem imports present in production code — audited hk-t5h2p.
        handler-contract:
          files: ["**/internal/handlercontract/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/handlercontract"
            - "github.com/google/uuid"

        # twinparity: leaf test-support package — normalized-event equivalence +
        # timing assertion library (M6 WS3-F1). Depends only on core (event-type
        # vocabulary), handlercontract (progress-msg vocabulary via
        # KnownProgressMsgTypes), stdlib, and self-import (external test pattern).
        # MUST NOT import daemon or any heavier subsystem — it is consumed by
        # scenario/parity tests, not by production paths.
        twinparity:
          files: ["**/internal/twinparity/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/handlercontract"
            - "github.com/gregberns/harmonik/internal/twinparity"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "twinparity is a leaf test-support package; MUST NOT import daemon (M6 WS3-F1)" }

        # handler-contract/lifecycle: leaf package — stdlib only (HC-064..HC-067).
        # No internal/ deps. Event emission wired in B4 (hk-q0uba follow-up).
        handler-contract-lifecycle:
          files: ["**/internal/handlercontract/lifecycle/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/handlercontract/lifecycle"

        # Adapters: core only.
        adapter-br:
          files: ["**/internal/adapter/br/**"]
          allow: ["$gostd", "github.com/gregberns/harmonik/internal/core"]
        adapter-ntm:
          files: ["**/internal/adapter/ntm/**"]
          allow: ["$gostd", "github.com/gregberns/harmonik/internal/core"]

        # Workspace: core + eventbus + adapter-br + handlercontract + uuid.
        # uuid is a leaf utility (no harmonik-internal deps); workspace needs it
        # to parse RunID/WorkflowID strings from JSON (leaselock.go, test helpers).
        # Already in core's allow-list; adding here is consistent.
        # handlercontract: conflictresolution_wm024.go builds a LaunchSpec and
        # claudetrust_wm040b.go wraps handlercontract.ErrStructural (hk-bfvby) so
        # the dispatch path classifies a bounded-lock timeout as structural.
        workspace:
          files: ["**/internal/workspace/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/eventbus"
            - "github.com/gregberns/harmonik/internal/adapter/br"
            - "github.com/gregberns/harmonik/internal/handlercontract"
            - "github.com/google/uuid"
            # lifecycle/tmux: the remote-substrate-aware "…Via(runner)" workspace
            # helpers (ComputeDiffHashVia, ReadReviewVerdictVia — hk-f3u6o) take a
            # tmux.CommandRunner so a REMOTE run's worktree reads route through the
            # worker's SSHRunner instead of a box-A os.ReadFile. diffhash.go,
            # remotematerialize.go, worktreepath.go already depend on it.
            - "github.com/gregberns/harmonik/internal/lifecycle/tmux"

        # Agent runner: core + eventbus + handler contract + adapter-ntm.
        agentrunner:
          files: ["**/internal/agentrunner/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/eventbus"
            - "github.com/gregberns/harmonik/internal/handlercontract"
            - "github.com/gregberns/harmonik/internal/adapter/ntm"

        # Hook: core + eventbus.
        hook:
          files: ["**/internal/hook/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/eventbus"

        # Memory: core + eventbus.
        memory:
          files: ["**/internal/memory/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/eventbus"

        # Handlers (claudecode, pi, twin): core + handlercontract.
        # Note: handler-impls targets internal/handler/claudecode, /pi, /twin subdirs which
        # do not yet exist (all handler code is flat in internal/handler/). Zero violations.
        # Path for handler/contract corrected to handlercontract per actual package layout.
        handler-impls:
          files: ["**/internal/handler/claudecode/**", "**/internal/handler/pi/**", "**/internal/handler/twin/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/handlercontract"

        # Scenario harness: DEFERRED — 12 violations (daemon, lifecycle, queue, workspace
        # imports + yaml.v3 + self-imports in test files). Real violations: scenario currently
        # drives the full stack and imports daemon/queue/lifecycle/workspace directly.
        # Follow-up: hk-uyxg0.
        # Revisit if the harness needs broader access (subsystem-organization.md §Deferred).
        # scenario:
        #   files: ["**/internal/scenario/**"]
        #   allow:
        #     - "$gostd"
        #     - "github.com/gregberns/harmonik/internal/core"
        #     - "github.com/gregberns/harmonik/internal/eventbus"
        #     - "github.com/gregberns/harmonik/internal/agentrunner"
        #     - "github.com/gregberns/harmonik/internal/orchestrator"
  
        # Improvement loop: core + eventbus + memory.
        # improvement:
        #   files: ["**/internal/improvement/**"]
        #   allow:
        #     - "$gostd"
        #     - "github.com/gregberns/harmonik/internal/core"
        #     - "github.com/gregberns/harmonik/internal/eventbus"
        #     - "github.com/gregberns/harmonik/internal/memory"
  
        # Orchestrator: the pure work-loop-brain leaf (M5 slice 3, codename
        # orchestrator). Value-in/value-out decision predicates over narrow
        # snapshot structs projected by the daemon under the QueueStore lock;
        # trimmed to $gostd + core exactly like internal/policy. internal/queue
        # is deliberately NOT allowed — enum fields are projected as
        # booleans/strings at the daemon boundary.
        orchestrator:
          files: ["**/internal/orchestrator/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
  
        # Composition root: may import every harmonik subsystem.
        # Also subject to llm-sdk-ban (see above).
        # uuid and yaml.v3 are direct deps of daemon production code.
        # depguard allow-list uses trailing-slash prefix matching (not Go-module "...").
        # mergeq: the merge-queue exclusion domain (RSM-002/RSM-012,
        # codename:run-state-machine). Leaf: stdlib + self-import only. The
        # daemon threads its prepare/commit closures IN as `critical` funcs, so
        # the direction is daemon -> mergeq; mergeq MUST NOT import daemon back.
        # NEW rule (not in TC-6's pre-authorization) applied per the same
        # "applied per carve" pattern (track-c-enforcement.md §2.2).
        # Rationale: specs/run-state-machine.md; merge-queue-design.md §1.
        mergeq:
          files: ["**/internal/mergeq/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/mergeq"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "mergeq MUST NOT import daemon (leaf exclusion domain; daemon drives it)" }

        # runmerge: the run-branch merge / commit / fmt-gate path carved out of
        # workloop.go lines 6391-8009 (P2 unit E5, RT13), plus the two whole
        # files that only the merge path called (stripruncontext, reviewtrailers).
        # Param-in/value-out git plumbing: it takes ctx + paths + an
        # EventEmitter + a runmerge.Submit closure and returns an Outcome. The
        # daemon threads its mergeq exclusion-domain submit IN, so the direction
        # is daemon -> runmerge; runmerge MUST NOT import daemon back.
        #
        # Measured allow-list (widen only on proof, per the E1a-1 finding):
        #   workspace       — the spine calls workspace.TaskBranchName /
        #                     WorktreePath / NoWorktreeRootOverride, and
        #                     RemoveWorktree calls PruneWorktreeTrust.
        #   gitprobe        — RevParse / ResolveWorktreeHEAD.
        #   harness/shared  — reviewtrailers.go's ContainsExactLine idempotency
        #                     check (moved there by P2 E1a-0).
        #   core            — RunID/BeadID/EventType + the two shared payloads.
        #   handlercontract — the EventEmitter the merge path emits through.
        # mergeq is deliberately NOT allowed — it appears in this region only in
        # comments, and the queue handle stays on the daemon side of the seam.
        # uuid is needed by the moved external test files (depguard `files:` globs
        # match _test.go too); it is a leaf utility with no harmonik-internal deps.
        # CAVEAT: depguard checks DIRECT imports only. The transitive check is
        # `go list -deps ./internal/runmerge | grep internal/daemon` (empty).
        # Rationale: plans/2026-07-21-p2-extraction/E5-dot-runloop.md; RSM-015.
        runmerge:
          files: ["**/internal/runmerge/**"]
          allow:
            - "$gostd"
            - "github.com/google/uuid"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/gitprobe"
            - "github.com/gregberns/harmonik/internal/handlercontract"
            - "github.com/gregberns/harmonik/internal/harness/shared"
            - "github.com/gregberns/harmonik/internal/workspace"
            - "github.com/gregberns/harmonik/internal/runmerge"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "runmerge MUST NOT import daemon (leaf merge path; daemon drives it) — P2 E5 RT13" }

        # runlaunch: the effects a bead run performs AROUND an agent launch,
        # stranded in workloop.go outside both E5 extraction regions and drained
        # here (P2 unit E5, RT19b). Four families, one concern — everything the
        # run path does at launch/ready time that is not the launch itself:
        #   - the CHB-018 pre-exec announcement relay (EmitPreExecMessage /
        #     EmitPreExecBeforeLaunch), which holds launch_initiated back until
        #     SpawnWindow returns (hk-4l7zs);
        #   - the HC-056 readiness deadlines (DefaultAgentReadyTimeout 150s /
        #     DefaultRemoteAgentReadyTimeout 210s / EffectiveAgentReadyTimeout /
        #     ErrAgentReadyTimeout / KillReapTimeout), which populate
        #     runexec.DispatchConfig.ReadyTimeout and .ReadyKillReap;
        #   - the launch/ready anomaly events (EmitSpawnCapBlocked hk-4l7zs,
        #     EmitTmuxNewWindowTimeout hk-r1rup, EmitAgentReadyTimeout hk-5cox8)
        #     and EmitImplementerPhaseComplete (hk-cd8yu);
        #   - ForceTeardownSession, the hk-68pvl kill-before-worktree-removal
        #     backstop.
        # It is the EFFECT vocabulary paired with internal/runexec's PURE Dispatch
        # machine, which models the same launch -> ready -> working segment.
        # It MUST be a leaf and not a runloop-private file: internal/daemon/
        # bootstate.go calls EmitSpawnCapBlocked / EmitTmuxNewWindowTimeout
        # from the BOOT path, and bootstate.go never moves.
        # internal/handler is required for handler.Session (ForceTeardownSession);
        # handlercontract for EventEmitter; core for the payload types.
        # CAVEAT: depguard checks DIRECT imports only. The transitive check is
        # `go list -deps ./internal/runlaunch | grep internal/daemon` (empty).
        # Rationale: plans/2026-07-21-p2-extraction/RT19b-stranded-run-path-helpers.md.
        runlaunch:
          files: ["**/internal/runlaunch/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/handler"
            - "github.com/gregberns/harmonik/internal/handlercontract"
            - "github.com/gregberns/harmonik/internal/runlaunch"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "runlaunch is a leaf: the run path's launch-time effects must not re-couple to the monolith, and bootstate.go depends on them too (P2 E5 RT19b)" }

        # runexec: the two pure run-lifecycle reactors (Dispatch + Run machines,
        # RSM-001/028, codename:run-state-machine). Trimmed leaf allow-list
        # ($gostd + core + substrate + self, design 00b R8): core supplies the
        # event-type constants the ActEmit actions carry; substrate supplies the
        # ClockPort determinism seam + the generic Run/EventSource/Effector the
        # reactors are driven by. The daemon shell (runshell.go) threads its
        # effector IN — direction is daemon -> runexec; runexec MUST NOT import
        # daemon back (RSM-028). NEW rule applied per the "applied per carve"
        # pattern (track-c-enforcement.md §2.2).
        # Rationale: specs/run-state-machine.md; runexec-design §0.
        runexec:
          files: ["**/internal/runexec/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/substrate"
            - "github.com/gregberns/harmonik/internal/runexec"
          deny:
            - { pkg: "github.com/gregberns/harmonik/internal/daemon", desc: "runexec MUST NOT import daemon (RSM-028; pure reactor leaf)" }

        daemon:
          files: ["**/internal/daemon/**"]
          allow:
            - "$gostd"
            - "go/"
            - "github.com/gregberns/harmonik/internal/"
            - "github.com/google/uuid"
            - "gopkg.in/yaml.v3"
            - "github.com/stretchr/testify/"
            - "go.uber.org/goleak"

        # bootconfig: pure daemon sub-package (giant-retirement boot-config).
        # Config-resolution stays isolated to $gostd + core; it must never pull in
        # queue/branching/workspace or the daemon package itself — daemon depends
        # on bootconfig, never the reverse (import-cycle caveat). The allow-list
        # IS the isolation gate: it whitelists ONLY $gostd, internal/core, and the
        # package's own external test package, so importing internal/daemon (or any
        # other subsystem) is rejected as "not allowed from list". A separate deny
        # row for internal/daemon is intentionally omitted: depguard prefix-matches,
        # so a deny on ".../internal/daemon" also matches ".../internal/daemon/
        # bootconfig" and would flag the package's own _test self-import.
        bootconfig:
          files: ["**/internal/daemon/bootconfig/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/core"
            - "github.com/gregberns/harmonik/internal/daemon/bootconfig"

        # CLI entry-point: composition root — may import every harmonik subsystem
        # plus cmd subpackages and external utility deps.
        # Also subject to llm-sdk-ban (see above).
        # depguard allow-list uses trailing-slash prefix matching (not Go-module "...").
        cmd:
          files: ["**/cmd/**"]
          allow:
            - "$gostd"
            - "github.com/gregberns/harmonik/internal/"
            - "github.com/gregberns/harmonik/cmd/"
            - "github.com/google/uuid"
            - "gopkg.in/yaml.v3"
    exhaustive:
      default-signifies-exhaustive: true
    testifylint:
      enable-all: true
issues: { max-issues-per-linter: 0, max-same-issues: 0 }
