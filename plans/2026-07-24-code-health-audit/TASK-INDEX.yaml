# Coordinator-owned source of truth. Workers read this file but never edit it.
schema_version: 2
updated: 2026-07-26
objective: >-
  Decompose the queue/run execution core into constructor-complete, independently
  testable owners; then restore and prove a reliable local queue -> durable
  reservation -> Bead claim -> Run -> local Pi process ->
  terminal/release/recovery path before primary-daemon deployment.

authority:
  task_cards: tasks/
  operating_protocol: tasks/README.md
  historical_inputs:
    - _plan.md
    - INTEGRATED-EXECUTION-PLAN.md
    - WORKTREE-RUNBOOK.md
  base_policy:
    before_integration_pr_merge: origin/integration/phase-reviewloop-20260725
    after_integration_pr_merge: origin/main
    claim_rule: >-
      The coordinator resolves the current allowed ref to an exact base_sha at
      claim time. A mutable ref is never a worker base.

state_model:
  phase: [triage, design, ready, implement, review, integrate, verify, complete]
  disposition: [open, deferred, blocked, superseded, dropped, closed]
  proof: [pending, green, red, deferred, not_required]
  ready_definition:
    - disposition is open
    - every hard dependency is complete
    - task card exists and has an independent approved card review
    - base-ref policy is resolvable and the exclusive lease is conflict-free
    - routing and required verification are defined
  claim_definition:
    - coordinator resolves the allowed base ref to an exact base_sha
    - owner, branch, worktree, and claimed_at are recorded before launch
    - claimed task is the only active writer in its lease family
  complete_definition:
    - implementation or evidence is integrated
    - every required proof is green
    - independent review is approved and findings are disposed
    - deferred proofs are explicitly non-blocking for this task

coordination:
  total_agent_slots: 4
  topology: "one coordinator/overseer plus three workers"
  index_owner: coordinator
  workers_must_not:
    - edit TASK-INDEX.yaml
    - expand a lease
    - create, close, or reassign Beads
    - create, remove, or rebase worktrees
  durable_return:
    - clean task worktree
    - one commit or one task evidence artifact
    - exact commands/results and deferred proofs
  build_limit: 2
  builder_tokens:
    count: 2
    rule: >-
      Every worker must acquire a coordinator-issued token before any test,
      build, vet, lint, UBS, or check command and release it immediately after
      the command finishes. Evidence-only source searches do not use a token.
  shared_lease_families:
    dispatch_spine: "internal/daemon/workloop.go claim/dispatch/terminal regions; one writer"
    workloop_recovery_spine: >-
      internal/daemon/workloop.go recovery/adoption call sites; claimed only
      after all prerequisite dispatch-spine tasks complete and mutually
      excluded from remaining Pi workloop integrations
    reviewloop_spine: "internal/daemon/reviewloop.go; one writer"
    dot_spine: "internal/daemon/dot_cascade_core.go and dot gate; one writer"
    composition_spine: >-
      daemon boot/workloop production-graph construction; serial only after all
      dispatch and mode integrations named by CG-01 are complete
    pi_launchspec: "internal/harness/pi/launchspec.go; one writer"
    queue_rpc: "internal/queue/rpc.go; one writer"

routing_profiles:
  sol_xhigh:
    model: gpt-5.6-sol
    reasoning_effort: xhigh
    use_for: [security, concurrency, durable_recovery, shared_spine, cross_group_review]
  sol_high:
    model: gpt-5.6-sol
    reasoning_effort: high
    use_for: [reviewed_shared_wiring, bounded_security_implementation]
  terra_high:
    model: gpt-5.6-terra
    reasoning_effort: high
    use_for: [bounded_multi_file_implementation, characterization_synthesis, scenarios]
  pi_ralph:
    model: local-nemotron-via-pi
    reasoning_effort: high
    use_for: [inventories, fixtures, pure_tables, narrow_mechanical_fixes]
    hard_stop: "no policy, security choice, shared spine, lease expansion, or broad integration"

waves:
  W0:
    goal: "repair tier-2 routing while two Pi workers inventory queue truth"
    coordinator_profile: sol_xhigh
    workers:
      - {task: CQ-DEF-01, profile: sol_high}
      - {task: CQ-00A, profile: pi_ralph}
      - {task: CQ-00B, profile: pi_ralph}
    next_candidates_after_review: [JR-00, PI-00]
  W1_rule: >-
    Integrate and review W0 before selecting from newly-ready tasks. Never run
    two tasks sharing a lease_family. Keep one frontier slot for review.
  ARCH_FOUNDATION:
    goal: "make architecture remediation, not patch accumulation, the P0 program"
    coordinator_profile: sol_xhigh
    workers:
      - {task: ARCH-00, profile: terra_high}
      - {task: JR-00, profile: terra_high}
      - {task: CQ-02, profile: sol_xhigh}
    rule: >-
      CQ-MIG-01 and CQ-02 contract work may proceed off-spine. No new semantic
      patch enters workloop/reviewloop/DOT unless its task consumes an extracted
      owner or is a failing-first proof required to create that owner.

groups:
  ARCH: {name: Run graph and state-machine architecture, priority: 0}
  CQ: {name: Core queue and durable reservation, priority: 1}
  JR: {name: Claim, Run, terminalization, and recovery, priority: 2}
  PI: {name: Local Pi security and lifecycle, priority: 3}
  E2E: {name: Bounded local end-to-end proof, priority: 4}
  DEFERRED: {name: Non-local or post-recovery work, priority: 5}

task_defaults:
  consumer_rule: >-
    Consumers overlay these fields onto every task record in memory; the
    defaults are not YAML merge keys and do not assert that a task is claimed,
    reviewed, integrated, or proven.
  claim: {owner: null, base_sha: null, branch: null, worktree: null, bead_id: null, claimed_at: null}
  card_review: {state: pending, reviewer: null, artifact: null, verdict: null}
  review: {state: pending, reviewer: null, artifact: null, verdict: null}
  integration: {state: pending, commit: null, integrated_sha: null}
  proof: pending

