  after_main_pr_merge: origin/main
status_model:
  phase: [triage, spec, ready, implement, review, integrate, verify, complete]
  disposition: [open, deferred, blocked, superseded, dropped, closed]
  verification: [pending, green, red, deferred, na]
worker_protocol:
  - Verify a ready task's dependencies, base, acceptance criteria, and exclusive file lease.
  - Create or claim its bead only after that check; one worktree and one atomic outcome per worker.
  - Characterize real boundaries before refactoring; keep logic pure and I/O behind consumer-shaped ports.
  - Record independent review and test evidence before completing/unblocking a task.
