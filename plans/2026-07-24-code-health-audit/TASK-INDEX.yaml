# Authoritative, machine-readable work inventory. Update status and evidence after every integration.
schema_version: 1
updated: 2026-07-25
planning_base:
  before_main_pr_merge: origin/integration/phase-reviewloop-20260725
  after_main_pr_merge: origin/main
status_model:
  phase: [triage, spec, ready, implement, review, integrate, verify, complete]
  disposition: [open, deferred, blocked, superseded, dropped, closed]
  verification: [pending, green, red, deferred, na]
worker_protocol:
  - Verify a ready task's dependencies, base, acceptance criteria, and exclusive file lease.
  - Create or claim its bead only after that check; one worktree and one atomic outcome per worker.
  - Characterize real boundaries before refactoring; keep logic pure and I/O behind consumer-shaped ports.
  - Record independent review and test evidence before completing/unblocking a task.
review_protocol:
  section_review:
    rule: "Every completed planning section and every implementation task is reviewed by a different agent before it is marked complete."
    reviewer_checks: [dependency correctness, missing cases, acceptance-test strength, lease overlap, simpler decomposition]
    evidence: "Record reviewer identity, verdict, findings, and disposition in the task/bead evidence before integration."
  group_review:
    rule: "Before starting a dependent group and before declaring a group complete, an independent cross-group review is required."
    reviewer_checks: [contract compatibility, duplicate ownership, ordering, durable-state consistency, error/recovery propagation, scenario coverage]
    evidence: "Update group-edge evidence and add/split tasks for every substantive finding."
execution_routing:
  capacity: {codex: 2, pi: 2, overseer: 1, future_claude: "same role as Codex when token budget permits"}
  rule: "Route by ambiguity and blast radius, not by repository area or perceived model prestige."
  lanes:
    pi_ralph:
      suitable: [mechanical test expansion, fixture work, characterization inventories, narrow pure functions, isolated adapters, deterministic bug fixes]
      requirements: [explicit task card, exclusive lease, bounded acceptance tests, short checkpoint cadence, no unresolved design decision]
      prohibited: [new cross-subsystem contract, security policy choice, shared-spine refactor, broad integration merge, operator decision]
    frontier:
      suitable: [contract/spec design, concurrency/recovery ownership, security boundaries, shared-spine changes, review, integration, complex failing-Pi recovery]
      responsibilities: [prepare Pi task cards, review every Pi completion, resolve escalations, own cross-group reviews]
  task_labels:
    - "complexity:low — deterministic, one file/adapter/test area; Pi preferred."
    - "complexity:medium — bounded multi-file behavior with an existing contract; Pi may implement after frontier task-card review."
    - "complexity:high — ambiguous ownership, concurrency, recovery, security, or cross-group change; frontier only."
    - "model:pi-ralph or model:frontier — execution assignment; reassess when evidence changes."
  ralph_loop: "Pi workers repeatedly claim only ready model:pi-ralph tasks, stop at acceptance or escalation, and never self-expand their lease. An overseer drains checkpoints, validates evidence, repairs/splits work, and keeps Pi workers supplied."
