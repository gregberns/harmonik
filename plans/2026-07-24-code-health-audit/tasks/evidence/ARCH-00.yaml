safe_leaf_contracts:
  - owner: internal/runexec Dispatch
    evidence: "Pure dispatch state machine, active through runloop segments."
    safe_use: "Retain and compose; do not duplicate mode-specific machines."
  - owner: internal/runexec Run
    evidence: "Pure Run/terminal decision machine, active through RunBridge."
    safe_use: "Retain; tighten effect ownership around it."
  - owner: internal/runloop PerRunEventTap
    evidence: "LIFT L1 landed with production callers."
    safe_use: "Event fan-out boundary."
  - owner: internal/runloop WaitPostAgentReadyProgress
    evidence: "LIFT L2 landed with focused tests."
    safe_use: "Post-ready observation, not phase ownership."
  - owner: internal/runloop WaitWithSocketGrace
    evidence: "LIFT L3 landed with production callers."
    safe_use: "Observation helper beneath a single future lifecycle owner."
  - owner: internal/runloop RunShell and DispatchSegment
    evidence: "LIFT L4 landed and use runexec machines."
    safe_use: "Effect execution for a bounded dispatch segment."
  - owner: internal/runloop scenario gate
    evidence: "LIFT L5 landed with deterministic classification tests."
    safe_use: "Gate leaf, not workflow coordination."
  - owner: internal/runloop RunBridge
    evidence: "LIFT L6 landed and production-wired."
    safe_use: >-
      Transitional adapter to retain while ownership is narrowed; do not grow
      SpineArgs or add another broad bridge.
  - owner: internal/runloop reviewer harness resolution
    evidence: "LIFT L7 landed and production-wired."
    safe_use: "Pure harness-resolution policy."
  - owner: internal/runlaunch
    evidence: "Active deadline/event/teardown helpers."
    safe_use: "Launch capability leaves beneath a future phase owner."

shared_spine_collision_zones:
  - lease_family: dispatch_spine
    paths:
      - internal/daemon/workloop.go
      - internal/daemon/runports.go
    rule: >-
      Exactly one semantic writer. WL, BR, CQ reservation, JR terminal, and Pi
      single-mode integration cards cannot overlap here.
  - lease_family: workloop_recovery_spine
    paths:
      - internal/daemon/workloop.go adoptLiveRunSession call sites
      - startup and in-flight adoption wiring
    rule: >-
      Recovery/adoption integration follows the prerequisite dispatch-spine
      changes and excludes remaining Pi workloop integrations.
  - lease_family: reviewloop_spine
    paths:
      - internal/daemon/reviewloop.go
      - reviewloop-owned production call sites
    rule: >-
      Reconcile the integration branch first; then serialize RL-02A/B/C and
      RL-03.
  - lease_family: dot_spine
    paths:
      - internal/daemon/dot_cascade_core.go
      - internal/daemon/dot_gate.go
      - internal/daemon/sub_workflow_runner.go
    rule: >-
      DOT progression may be pure/file-disjoint, but agentic node, gate, and
      coordinator rewiring are serialized.
  - lease_family: process_phase_scope
    paths:
      - internal/runloop
      - internal/runlaunch
      - internal/daemon/tmuxsubstrate.go
      - mode-specific session call sites
    rule: >-
      The pure lifecycle contract precedes adapter and mode integration. One
      owner must settle Wait/kill/reap/close semantics.
  - lease_family: queue_rpc
    paths:
      - internal/queue/rpc.go
      - production HandlerAdapter construction
    rule: >-
      One writer for submit/append transaction and admission semantics; caller
      migrations outside RPC remain file-disjoint.
  - lease_family: pi_launchspec
    paths:
      - internal/harness/pi/launchspec.go
      - direct launch-spec tests
    rule: >-
      Pi security/credential and launch-spec tasks serialize here and cannot
      broaden into the dispatch spine.
  - lease_family: composition_spine
    paths:
      - internal/daemon/bootworkloop.go
      - internal/daemon/bootstate.go
      - internal/daemon/daemon.go
      - cmd/harmonik production Start callers
    rule: >-
      Serial cutover only after extracted owners and mode integrations are
      complete.

test_and_proof_state:
  strengths:
    - runexec pure machines have table/property-style unit coverage
    - LIFT leaves have focused package tests and dependency guards
    - workloop has many queue, liveness, cancellation, and scenario regressions
    - reviewloop branch adds a behavior freeze and pure kernels
  gaps:
    - no single deterministic trace freezes every outer-loop effect ordering
    - StartForTesting permits injection combinations different from production
    - no single immutable production graph can be inspected or constructed
    - primary daemon runtime proof is intentionally absent
    - process/session ownership is tested by mode rather than one lifecycle contract
    - CQ-00 completion is inconsistent between the phase and integration refs
  implication: >-
    WL-01, JR-00, RL-01, and the architecture contract are prerequisites, not
    optional analysis. Existing regression volume does not make extraction safe
    without fidelity traces and constructor completeness.

conclusions:
  dominant_hotspot: >-
    workloop.go is the dominant structural hotspot: 6,650 lines, two functions
    totaling 3,965 lines, cognitive scores 888 and 396, 81-field workLoopDeps,
    49 imports, and 369 touching commits in the measured window.
  secondary_hotspots:
    - "reviewloop is the largest mode-specific state machine."
    - "DOT is the most concentrated production mode core."
    - "tmux/process lifecycle is a cross-mode ownership boundary, not merely a large file."
  progress_assessment: >-
    Two weeks of refactoring produced real leaf packages, pure machines, ports,
    and dependency direction. It reduced some direct coupling but did not
    materially reduce the central state-machine spans or eliminate temporal
    construction.
  required_direction: >-
    The current graph proves that the remaining move-first instructions cannot
    execute unchanged: they retain daemon-private dependencies, broad late
    construction, or unresolved lifecycle ownership. ARCH-01 owns the target
    ownership/construction decision; RL-01 owns reconciliation of the staged
    reviewloop work. This artifact selects neither final packages nor permanent
    task disposition.

