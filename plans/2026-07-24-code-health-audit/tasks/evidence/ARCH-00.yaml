symbol_knots:
  - id: dot_subworkflow_recursive_dispatch_knot
    edges:
      - driveDotWorkflow -> newDotSubWorkflowRunner
      - dotSubWorkflowRunner.Run -> dispatchDotAgenticNode
      - dotSubWorkflowRunner.Run -> dispatchDotGateNode
      - dotSubWorkflowRunner.Run -> dispatchDotToolNode
      - dotSubWorkflowRunner.Run -> nested dotSubWorkflowRunner.Run
    type: same_package_dependency_knot_with_recursive_runner
    consequence: >-
      No edge returns to driveDotWorkflow, so this is not a mutual symbol cycle.
      The runner recursively dispatches nested sub-workflows and calls the
      daemon-private node dispatchers; moving either side alone would require a
      callback/dispatcher contract or reverse the package direction.
  - id: dot_review_helpers
    edges:
      - dot_cascade_core -> rlComputeDiffHashVia
      - dot_cascade_core -> rlTruncateUTF8
      - dot_cascade_core -> emitReviewFixupStalled
      - dot_cascade_core -> emitReviewerBudgetExceeded
    type: same_package_cross_mode_dependency
    consequence: >-
      Review-specific helpers must become owned contracts before DOT can leave
      daemon or be decomposed independently.
  - id: daemon_runloop_direction
    edges:
      - internal/daemon -> internal/runloop
      - internal/runloop -/-> internal/daemon
    type: import_direction_constraint
    consequence: >-
      Any moved function that still consumes daemon-private symbols would
      reverse the established dependency direction and create a Go import
      cycle. The contract must move or invert dependencies first.
  - id: temporal_construction
    edges:
      - newWorkLoopDeps -> incomplete workLoopDeps
      - bootState.injectWorkLoopDeps -> mutable completion
      - runWorkLoop -> per-run construction
      - beadRunOne -> late Launch/Worktree/LaunchBuilder completion
    type: lifecycle_cycle
    consequence: >-
      Construction completeness cannot be checked at compile time and tests can
      exercise bundle combinations production never constructs.

