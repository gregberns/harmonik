uncovered_cuts:
  - "No injected crash/restart precisely after successful submit Persist and before QueueStore SetQueue/Wake."
  - "No injected crash/restart precisely after successful append Persist and before LockedSetQueueByName."
  - "No injected crash/restart after an append/group transition is installed but before its lifecycle event is emitted."
  - "activateFirstPendingGroup mutates the live queue before Persist; no fault test proves the resulting memory-active/disk-pending state or restart behavior when Persist fails."
  - "Dispatch uses two queue writes before ClaimBead: first dispatched with an empty RunID placeholder, then a RunID patch. No restart fixture targets the empty-RunID state or either write's failure."
  - "No injected crash after durable dispatched+RunID and before ClaimBead; existing lifecycle tests cover load/revert through fakes."
  - "No direct crash injection after successful ClaimBead and before run_started; DispatchTrackerOrphan covers the equivalent recovered state through daemon.Start."
  - "run_started is emitted before optional independent-session runpkg.Write. No test interrupts there, and .harmonik/runs records are non-universal by design."
  - "On claim failure, production mutates the live item back to pending and clears RunID before a non-fatal Persist; no fault oracle covers memory-pending/disk-dispatched divergence."
  - "No injected crash between completed-status Persist and Unlink. CompleteAndUnlink success retry is unit-covered, but no test forces Persist/Unlink failure and observes that the QueueStore slot is still cleared."
  - "CancelQueueOnShutdown mutates live status to cancelled before Persist and does not roll back. No test forces Persist/rename/fsync failure or observes drainCancelledQueue clearing the slot despite error."
  - "MigrateFromLegacy does not validate an already-existing destination before removing legacy; corrupt, empty, or conflicting main.json destination cases are untested and potentially destructive."
  - "MigrateFromLegacy has no injected failures for destination-directory fsync, legacy removal, or .harmonik directory fsync, so post-error durable ownership is unproven."
  - "Persist has no rename or parent-directory-fsync fault injection. A rename followed by fsync/open/close failure can return ErrPersistFailed after the target changed, creating an ambiguous-success result."
