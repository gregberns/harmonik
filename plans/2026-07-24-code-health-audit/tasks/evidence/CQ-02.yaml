    rollback_boundary: review-charge adapter only
    conflicts: [none file-disjoint]
  - task: CQ-CALLER-BOOTSTRAP
    prerequisites: [CQ-02I, CQ-01]
    lease_family: queue_cli_bootstrap
    writes: [cmd/harmonik/run.go runBeadSubcommandIO initial queue.Persist pre-daemon ArchiveFailedQueue paused cancelled proven-orphan branches and QueueStore adoption plus focused tests]
    failing_first_proof: bootstrap routes through started/adopted owner and has no pre-ownership disk writer
