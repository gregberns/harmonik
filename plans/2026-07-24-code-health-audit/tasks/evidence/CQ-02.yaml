event_ordering:
  - event: queue_group_completed
    durability: F normal-path fsync-backed attempt; queue receipt/state remain authoritative
    required_predecessors: [last item terminal event, durable queue state; final success also requires durable completion receipt]
    forbidden_predecessors: [canonical unlink before receipt durability, restart synthesis, JSONL recovery decision]
    outbox: false
    replay: never
    failure_action: diagnostic only; continue queue-owned cleanup/release/admission
  - event: queue_group_started
    durability: existing O-class unchanged
    required_predecessors: [durable successor activation]
    forbidden_predecessors: [uncommitted queue state]
    outbox: false
    replay: never by CQ-02
    failure_action: diagnostic only
  - event: queue_paused
    durability: existing F-class normal-path attempt unchanged
    required_predecessors: [durable paused queue state, queue_group_completed attempt on same uninterrupted path]
    forbidden_predecessors: [uncommitted pause]
    outbox: false
    replay: never by CQ-02
    failure_action: diagnostic only; exact-ID status remains authority
  - event: queue_cancelled_operator
    durability: O
    required_predecessors: [durable archive/legacy cleanup, archive-intent removal, QueueStore/refusal release]
    forbidden_predecessors: [graceful shutdown, unresolved ownership, replacement/archive intent membership]
    outbox: false
    replay: never
    failure_action: cancellation success remains successful; diagnostic only and RPC response not suppressed
migration_rules:
  - {state: valid legacy only, action: create directory-durable main from exact bytes then durably remove legacy, failure: retain at least one valid copy}
  - {state: valid canonical only, action: load canonical, failure: none}
  - {state: equivalent valid both, action: retain canonical and durably remove legacy, failure: both may remain equivalent}
  - {state: divergent valid both, action: preserve both and refuse, failure: operator repair}
  - {state: invalid legacy or invalid canonical, action: preserve/quarantine and refuse without overwrite, failure: operator repair}
  - {state: neither, action: no queue, failure: none}
  - {state: destination rename or legacy unlink parent-sync ambiguity, action: exact reload/compare/sync classifier, failure: never delete last valid copy}
implementation_slices:
  - task: CQ-02I
    prerequisites: [CQ-02, CQ-MIG-01]
    lease_family: queue_transaction_substrate
    writes: [QueueStore snapshot/generation transaction API, generic replace/archive-intent schemas/classifiers including optional exact linked archive-handoff record, typed persistence results and tests]
    failing_first_proof: ordinary replacement fault cuts and stale generation fail without live-pointer mutation
    accepted_intermediate_state: generic transaction/intent substrate only; no receipt QueueStatus QM-053 completion payload or optional group-observation delivery
    rollback_boundary: revert generic substrate as one unit before caller migration
    conflicts: [CQ-01 and CQ-RECEIPT follow on internal/queue persistence/store APIs; no caller migration may overlap substrate shape changes]
  - task: CQ-01
    prerequisites: [CQ-02I]
    lease_family: queue_rpc_admission
    writes: [internal/queue/rpc.go submit append and exact owned tests]
    failing_first_proof: submit plus group-zero and append each use one immutable transaction
    accepted_intermediate_state: RPC admission migrated; receipt/status symbols still disabled and optional group-observation delivery not enabled
    rollback_boundary: submit/append RPC symbols only
    conflicts: [CQ-RECEIPT follows on internal/queue/rpc.go]
  - task: CQ-RECEIPT
    prerequisites: [CQ-02I, CQ-01]
    lease_family: queue_receipt
    writes: [completion receipt and immutable completion-release marker v1 schemas/store/root/install/read/CAS cleanup/trusted-clock retention/receipt-first marker-last GC, internal/queue/types.go QueueStatusRequest QueueStatusResponse, internal/queue/rpc.go HandleQueueStatus findQueueByID HandlerAdapter.HandleQueueStatus, internal/queue/cli/status.go RunQueueStatus, internal/queue/cli/client.go renderQueueStatusText, focused JSON/text/wire tests, QM-053 primitives, internal/core/queueevents_extqueue.go QueueGroupCompletedPayload.CompletionReceiptID and QueueGroupCompletedPayload.Valid plus internal/core/queueevents_extqueue_test.go UUID/additive compatibility tests, focused fault/restart tests]
    conflicts: [CQ-01 on internal/queue/rpc.go must precede, CQ-CALLER-CANCEL on internal/queue/rpc.go must follow]
    failing_first_proof: intent-bound one receipt survives every root/install/CAS cut; marker cannot predate durable cleanup and ownership release; missing-marker restart selects a later anchor; exact/conflicting/corrupt/unsupported markers classify; delayed cleanup past completed_at plus 30 days still waits released_at plus 720 hours; unavailable or regressed clock refuses; event append failure still cleans up; GC proves pair identity and threshold then receipt-first marker-last exact unlink definite failure already-absent idempotency ambiguity root-open/root-fsync reload-before-retry close diagnostics marker-only recovery and admission nonblocking
    accepted_intermediate_state: receipt/release-marker/status/QM-053 primitives land but optional group-observation delivery not enabled and terminal workloop callers remain gated
    rollback_boundary: receipt/status/QM-053/root/release-marker/retention/complete-GC primitives are one unit; no receipt producer or partial GC without marker capability and no global event writer/replay changes
  - task: CQ-RUN-WAIT
    prerequisites: [CQ-RECEIPT]
    lease_family: run_via_daemon_waiter
    writes: [cmd/harmonik/run_via_daemon.go runBeadSubcommandViaDaemon watcher call site viaWatchGroupCompletion signature/body and smallest viaQueueStatusByID helper or injected viaStatusQuery seam backed by viaSendRequest over a separate RPC connection plus focused fresh-submit/shared-append tests]
    failing_first_proof: fresh submit and shared append each query immediately after accepted setup and after every heartbeat; pending/active continues; transport failure terminates; queue_group_completed absent; final receipt; non-final success; paused-by-failure; same-name isolation; complete own-bead observations; incomplete own-bead observations; integrity failures
    accepted_intermediate_state: exact-ID fallback protects both wait branches; optional group-observation delivery not enabled until integration after this slice
    rollback_boundary: watcher call site signature/body independent status-query seam/helper and focused tests only
    conflicts: [none; status server is CQ-RECEIPT-owned and must precede]
  - task: CQ-CALLER-CANCEL
    prerequisites: [CQ-RECEIPT]
    lease_family: queue_cancel_rpc
    writes: [internal/queue/types.go QueueCancelRequest QueueCancelResponse preserving JSON queue and force plus additive queue_id, internal/queue/rpc.go HandlerAdapter.HandleQueueCancel after CQ-RECEIPT, internal/queue/cli/cancel.go RunQueueCancel tryDaemonQueueCancel cancelFindByID journalCancel emitQueueCancelEvent daemon-only migration, N-1 queue/force and dual-selector conflict tests, internal/core/eventtype.go EventTypeQueueCancelledOperator, internal/core/queueevents_extqueue.go QueueCancelledOperatorPayload and Valid, internal/core/eventreg_hqwn59.go registerQueueEvents, internal/core/pertypecompat_hqwn38.go compatibility row, internal/core/queueevents_extqueue_test.go internal/core/pertypecompat_hqwn38_test.go internal/core/eventtype_coverage_gjyks_test.go constructor/decode/cohort/count/Class-O/compatibility coverage]
    conflicts: [CQ-RECEIPT on internal/queue/rpc.go and internal/queue/types.go must precede]
    failing_first_proof: daemon-down exit 17 writes nothing; replace-only exact-pair archive-only mismatch/originless classifiers; successor create/write/fsync/close/rename/parent-sync; predecessor delete/parent-sync; archive rename/parent-sync; main legacy unlink/.harmonik sync; successor removal/parent-sync; registered XOR audit decode/compat/cohort; audit failure preserves success
    accepted_intermediate_state: cancellation serialized after receipt same-file work; optional group-observation delivery not enabled
    rollback_boundary: linked handoff cancel CLI/RPC and complete typed audit registration are one slice
  - task: CQ-CALLER-GROUP-ACTIVATION
    prerequisites: [CQ-03]
    lease_family: dispatch_spine
    writes: [internal/daemon/workloop.go activateFirstPendingGroup activateFirstPendingGroupLocked and exact callers plus focused tests]
    conflicts: [CQ-03 JR-03 CQ-CALLER-OPERATOR CQ-CALLER-WORKLOOP-MAINTENANCE serialize on workloop.go dispatch_spine]
    failing_first_proof: submit/advance never expose separate normal-path activation persist
    accepted_intermediate_state: standalone normal activation removed; optional group-observation delivery not enabled
    rollback_boundary: activation symbols only
  - task: JR-01
    prerequisites: [CQ-03, JR-00, BR-00]
    lease_family: dispatch_reservation
    writes: [internal/daemon/workloop.go ClaimBead through durable Run-record and runRegistry.Register pre-launch region, claim/Run phase owner defined by BR-00, on-disk Run record and registry adapters, focused duplicate/crash tests]
    failing_first_proof: after CQ-03 durable reservation ClaimBead failure returns durably or fails closed; crash before and after durable Run record or runRegistry.Register converges to exactly one correlated Run ID before launch
    accepted_intermediate_state: reservation semantics settled before startup/final cleanup
    rollback_boundary: claim through Run-registration phase plus its narrow adapters only
    conflicts: [CQ-03 precedes and JR-03 follows on internal/daemon/workloop.go dispatch spine]
  - task: CQ-04
    prerequisites: [CQ-RECEIPT, JR-01]
    lease_family: queue_startup_recovery
    writes: [internal/lifecycle/startup_pl005_qm002.go LoadQueueAtStartup loadOneQueueAtStartup reconcileQueueTerminalState reconcileDispatchedItems reconcileThreeWay plus supported intent receipt root CAS cleanup recovery and tests]
    failing_first_proof: startup resolves queue-owned records without JSONL and never synthesizes final event; reconcileDispatchedItems claim-loss correction is transactional; reconcileThreeWay commits all A/D corrections before A/D/C/B attempts and restart converges
    conflicts: [JR-04 startup join follows; no concurrent edits to startup_pl005_qm002.go]
    accepted_intermediate_state: complete capability recovery available; live receipt-producing terminal call sites and optional group-observation delivery remain gated by JR-03
    rollback_boundary: startup queue recovery phase only
  - task: JR-03
    prerequisites: [CQ-RUN-WAIT, CQ-04, JR-01, JR-02, BR-03, CQ-CALLER-GROUP-ACTIVATION]
    lease_family: dispatch_terminal
    writes: [internal/daemon/workloop.go evaluateGroupAdvanceWithOutcome terminal claim-release QM-053 call sites and drainCancelledQueue plus focused tests]
    conflicts: [all workloop.go dispatch_spine cards serialize]
    failing_first_proof: terminal paths consume receipt primitives; missing observations cannot hang waiter; startup never emits final event
    accepted_intermediate_state: crash-optional group-observation delivery may be enabled only now after waiter integration and capable startup recovery
    rollback_boundary: JR-03 terminal composition; CQ-04 or CQ-RUN-WAIT rollback first requires disabling receipt-producing live terminal call sites
  - task: CQ-03
    prerequisites: [CQ-01, CQ-02I, WL-03]
    lease_family: dispatch_spine
    writes: [internal/daemon/workloop.go selected-item pending-to-dispatched reservation and adjacent post-startRun Run-ID patch, RunRegistry.Len and RunRegistry.LenForQueueLocal plus selected Queue.Workers capacity revalidation reads, internal/queuewiring/store.go narrow locked snapshot transaction API, focused race/fault/restart tests]
    failing_first_proof: one reservation persists before Beads claim/handler launch; stale generation or newly exhausted global/selected-queue capacity retries before mutation; failed persist exposes no runnable owner; claim-loss restart converges through reconcileDispatchedItems; Run-ID patch never installs unclassified state
    conflicts: [all workloop.go dispatch_spine cards serialize]
    accepted_intermediate_state: reservation consumes generic transaction; terminal/receipt behavior unchanged
    rollback_boundary: CQ-03 existing card
  - task: CQ-CALLER-EAGER
    prerequisites: [CQ-02I]
    lease_family: queue_eager_refill
    writes: [internal/daemon/eagerfill_em063.go eagerRefillEval complete snapshotFleet consumption all-name duplicate pre-screen deterministic normalized-name refill target queue mutation and focused tests]
    failing_first_proof: every named queue is scanned; a sibling duplicate is excluded; paused completed full or ineligible siblings do not block an eligible stream; global and per-queue capacity bound deficit; persist failure leaves installed eager state unchanged and emits no success observation
    accepted_intermediate_state: named eager refill consumes transaction; no receipt ownership
    rollback_boundary: eagerRefillEval named-fleet selection and queue mutation only
    conflicts: [none file-disjoint]
  - task: WL-03
    prerequisites: [ARCH-01, ARCH-GATE, WL-01, WL-02A, WL-02B, WL-MUT-01]
    lease_family: dispatch_spine
    writes: [internal/daemon/workloop.go queueSelection snapshotFleet selectNextQueue steady-state caller cursor advance and br-ready arbitration, internal/orchestrator/select.go FleetSnapshot SelectNextQueue, focused selection tests]
    failing_first_proof: one complete immutable named-set snapshot feeds pure selection; fallback is enabled only with --auto-pull and only when fleet.named_queues IS EMPTY; non-empty ineligible fleet idles without consulting br ready; paused completed full or ineligible siblings do not block; global and per-queue gates hold; QM-067 cursor advances on every selection and reset-starvation fixture fails
    accepted_intermediate_state: WL-03 returns an immutable named-queue candidate and performs no reservation claim Run registration persistence terminal or process effect
    rollback_boundary: pure fleet projection selection and steady-state source arbitration only
    conflicts: [all workloop.go dispatch_spine cards serialize; CQ-03 consumes WL-03 output]
  - task: CQ-CALLER-OPERATOR
    prerequisites: [CQ-02I]
    lease_family: queue_operator_events
    writes: [internal/queuewiring/operatorevents.go QueueOperatorEventConsumer.transitionToPausedByDrain QueueOperatorEventConsumer.transitionToActive and focused tests]
    failing_first_proof: pause/resume failure preserves installed state and retry converges
    accepted_intermediate_state: operator pause/resume consumes transaction; cancellation remains separate
    rollback_boundary: operator pause/resume symbols only
    conflicts: [none file-disjoint from workloop and queue-cancel]
