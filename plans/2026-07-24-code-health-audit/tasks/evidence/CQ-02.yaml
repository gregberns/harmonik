    prerequisites: [CQ-03, JR-03]
    lease_family: dispatch_spine
    writes: [internal/daemon/workloop.go deferred reevaluation claim-skipped dependency cross-queue duplicate and max-attempt direct-persist regions plus focused tests]
    failing_first_proof: each mutation fails closed/retries to one state without reopening reservation terminal or activation
    accepted_intermediate_state: residual maintenance consumes transaction API
    rollback_boundary: four named workloop branches only
    conflicts: [all workloop.go dispatch-spine cards serialize; adoption excluded and owned by JR-04 then WL-REC-01]
  - task: CQ-CALLER-INLINE-EXIT
    prerequisites: [CQ-CALLER-BOOTSTRAP, JR-03]
    lease_family: queue_inline_exit
    writes: [cmd/harmonik/run.go runBeadSubcommandIO post-daemon paused-by-failure archive/exit region and focused tests]
    failing_first_proof: post-daemon failure routes through owner and durable archive precedes truthful exit
    accepted_intermediate_state: inline run has no direct archive writer
    rollback_boundary: post-daemon inline-exit region only
    conflicts: [CQ-CALLER-BOOTSTRAP precedes on cmd/harmonik/run.go]
  - task: JR-04
    prerequisites: [CQ-04, JR-03]
    lease_family: run_session_adoption
    writes: [internal/daemon/runinflightreconcile_hkr73qr.go reconcileOrphanedRunsOnResume, internal/daemon/run_session_adoption.go adoptLiveRunSession, exact focused recovery adoption tests]
    failing_first_proof: repeated orphan claim recovery and live-session adoption is idempotent; PID/session ambiguity fails closed; adopted and retried runs cannot both own the item
    conflicts: [CQ-04 and JR-03 precede; WL-REC-01 follows; workloop call sites read-only]
    accepted_intermediate_state: typed recovery/adoption owner ready; inline workloop call sites remain for WL-REC-01
    rollback_boundary: runinflightreconcile_hkr73qr.go run_session_adoption.go adoptLiveRunSession typed boundary and focused tests only
  - task: WL-REC-01
    prerequisites: [ARCH-GATE, JR-04, BR-04, CQ-03, WL-03]
    lease_family: workloop_recovery_spine
    writes: [internal/daemon/workloop.go recovery adoption call sites, narrow adapter wiring, inline adoption policy removal, focused mutation fault restart tests]
    failing_first_proof: repeated loop iterations cannot adopt and retry the same Run; ambiguous session/provenance fails closed; only typed JR-04 effects are applied
    conflicts: [JR-04 production files read-only; serialize with all workloop.go cards]
    accepted_intermediate_state: recovery policy exists only in JR-04 owner and runWorkLoop retains scheduling and effect application
    rollback_boundary: workloop recovery adoption call-site migration and narrow adapter only
