normative_dispositions:
  - {clause: QM-001, disposition: amend, reason: typed results and durable replace intent classify every namespace cut}
  - {clause: QM-002, disposition: amend, reason: classify queue-owned intents and receipts before canonical load/readiness}
  - {clause: QM-002c, disposition: amend, reason: preserve one valid copy through destination and legacy parent-sync cuts}
  - {clause: QM-003, disposition: supersede, reason: receipt durability and queue-ID plus digest CAS cleanup replace event-landmark unlink}
  - {clause: QM-033, disposition: amend, reason: final group event is derived observation; completion receipt is authoritative}
  - {clause: QM-050, disposition: amend, reason: submit and group-zero activation are one replacement transaction}
  - {clause: QM-051, disposition: amend, reason: owns state transition but not QM-053 receipt cleanup or final event authority}
  - {clause: QM-052, disposition: amend, reason: failed group terminal and queue paused-by-failure commit in one candidate transaction}
  - {clause: QM-053, disposition: amend, reason: sole owner of receipt creation, optional observation attempt, CAS unlink, and release}
  - {clause: QM-057, disposition: amend, reason: exact-ID live lookup falls back to exactly one identity-consistent retained receipt}
  - {clause: QM-058, disposition: amend, reason: cancellation uses replacement then archive intent and never creates a receipt}
  - {clause: QM-060, disposition: supersede, reason: QueueStore transaction domain is the sole mutation owner}
  - {clause: QM-061, disposition: amend, reason: submission serializes through QueueStore while QM-027 occupancy is per normalized name rather than project-wide}
  - {clause: QM-063, disposition: amend, reason: queue-owned durability precedes observations and observation failure never rolls back or refuses}
  - {clause: PL-005, disposition: amend, reason: receipt root and complete capability recovery precede readiness}
  - {clause: PL-004, disposition: amend, reason: inventory canonical named queue records and retire legacy singleton live writes}
  - {clause: PL-013, disposition: amend, reason: idle input is the QueueStore named set not legacy queue.json}
  - {clause: PL-027, disposition: amend, reason: upgrade downgrade and rollback require the whole queue intent/receipt capability}
  - {clause: PL-028c, disposition: amend, reason: daemon-unreachable cancellation exits 17 and writes nothing}
  - {clause: EV-021, disposition: preserve, reason: observational replay never reconstructs queue state}
  - {clause: EV-022, disposition: preserve, reason: queue recovery never walks JSONL}
  - {clause: EM-015f, disposition: amend, reason: MUST emit is a normal-path post-commit attempt, not crash-surviving delivery}
  - {clause: EM-glossary-queue, disposition: amend, reason: active queue and queue group are per named QueueStore member rather than project-wide singleton terms}
  - {clause: EM-062, disposition: amend, reason: eager refill selects one deterministic eligible active stream target from a complete named-fleet snapshot}
  - {clause: EM-063, disposition: amend, reason: daemon duplicate pre-screen scans all named queues in one immutable QueueStore generation}
  - {clause: EM-064, disposition: amend, reason: orchestrator tier-one pre-screen scans the complete QueueStore named set before other authorities}
  - {clause: EM-065, disposition: amend, reason: submit and append occupancy semantics are per normalized target name after the all-queue duplicate screen}
  - {clause: EM-§6.5-queue-lifecycle, disposition: amend, reason: lifecycle observations identify the affected named queue and never imply a singleton}
  - {clause: EM-§7.4, disposition: amend, reason: steady-state selection consumes complete fleet snapshots with empty-set-only fallback both capacity gates and QM-067 cursor advance}
  - {clause: EM-§9.3-queue-dependencies, disposition: amend, reason: dependency map assigns identity lifecycle QueueStore workers and arbitration ownership to queue-model}
  - {clause: EM-§10.1-queue-dispatch, disposition: amend, reason: conformance requires eligible named selection empty-set-only fallback all-queue pre-screen and per-name submit}
  - {clause: EM-066, disposition: amend, reason: exact branch reference now names complete fleet.named_queues IS EMPTY while all other flag and default semantics remain unchanged}
  - {clause: EM-067, disposition: amend, reason: exact pause-order reference now names the complete named-set-empty branch while preserving both pause gates}
  - {clause: EM-§10.2-auto-pull-pause-fixture, disposition: amend, reason: fallback pause fixture enables the opt-in with --auto-pull set}
  - {clause: EM-§10.2-nonempty-ineligible-fixture, disposition: amend, reason: adjacent fixture proves nonempty wholly ineligible named fleet suppresses br ready fallback}
topology:
  canonical_write_layout: .harmonik/queues/<normalized-name>.json; only the daemon/project QueueStore or its bounded same-process startup adapter writes
  readable_legacy_layouts:
    - .harmonik/queue.json is migration-only main input and never a new-write target
    - schema-version-1 .harmonik/queues/<normalized-name>.json canonical envelopes
    - supported replace/archive intents and flat completion receipts are protocol records, never live queues
  collision_rule: canonical, unresolved intent, quarantine, or identity-integrity error owns/refuses the normalized name; old retained receipts alone do not block reuse
transaction_owner:
  owner: single daemon/project QueueStore with a bounded same-process pre-install startup adapter
  serialization: one transaction domain per normalized name; lexical ordering for multi-name operations; same-file implementation cards serialize by dependency or exact disjoint symbol lease
  generation_rule: detached snapshots carry a volatile process-local generation rejected before I/O; advance once after durable install; never persisted or used after restart
  forbidden_direct_writers:
    - daemon-unreachable queue CLI
    - inline pre-owner fallback
    - RPC workloop lifecycle eager budget review crew or operator caller mutating a live pointer or filesystem
    - caller-side canonical replace unlink archive legacy removal receipt or GC outside QueueStore/startup primitives
  wire_compatibility:
    submit:
      request_fields: [groups, schema_version, name, workers, spend_cap_usd, default_harness]
      response_fields: [queue_id, status, group_count]
    append:
      request_fields: [queue_id, name, group_index, bead_ids]
      selector_precedence: queue_id_then_name_then_main
      response_fields: [appended_count, new_tail_indices]
    status:
      request_fields: [name, queue_id, watched_group_index]
      selector_precedence: name_then_queue_id_then_main
      response_preserved_fields: [queue, max_concurrent]
      response_added_fields: [completed, final_status, final_group_index, success_count, fail_count, completed_at, completion_receipt_id]
      cli_owner: internal/queue/cli/status.go RunQueueStatus
      renderer_owner: internal/queue/cli/client.go renderQueueStatusText
    cancel:
      request_fields: [queue, force, queue_id]
      selector_precedence: queue_only_or_queue_id_only; both_must_resolve_same_identity; neither_is_invalid
      n_minus_1_rule: shipped JSON queue plus force decodes unchanged; queue is not renamed to name
      response_fields: [queue_id, prior_status]
transaction_protocol:
  - {step: 1, owner: QueueStore, input_state: normalized name and request, success_state: transaction domain acquired, failure_state: rejected before I/O, externally_visible: false}
  - {step: 2, owner: QueueStore, input_state: detached snapshot and expected generation, success_state: generation matches, failure_state: rejected stale generation, externally_visible: false}
  - {step: 3, owner: QueueStore, input_state: immutable stored snapshot or absence, success_state: private deep clone/create candidate, failure_state: rejected with prior untouched, externally_visible: false}
  - {step: 4, owner: QueueStore, input_state: private candidate, success_state: mutation/request validation complete, failure_state: rejected before namespace I/O, externally_visible: false}
  - {step: 5, owner: QueueStore, input_state: validated candidate, success_state: exact canonical bytes and applicable normal-path event payload fixed, failure_state: not_committed before intent, externally_visible: false}
  - {step: 6, owner: QueueStore, input_state: exact bytes, success_state: candidate temp write/fsync/close durable, failure_state: not_committed with canonical untouched, externally_visible: false}
  - {step: 7, owner: QueueStore, input_state: durable candidate temp, success_state: exact replace intent directory-durable, failure_state: not_committed or exact intent classifier, externally_visible: false}
  - {step: 8, owner: QueueStore, input_state: durable intent, success_state: canonical rename and queue-parent durability classified, failure_state: commit_indeterminate and name quarantined pending exact reconciliation, externally_visible: false}
  - {step: 9, owner: QueueStore, input_state: committed_durable canonical, success_state: install candidate and advance generation once, failure_state: no install until classification, externally_visible: true}
  - {step: 10, owner: QueueStore, input_state: installed ordinary mutation, success_state: repeatable Wake and applicable normal-path observation attempt, failure_state: observation failure diagnostic only and never a state/admission gate, externally_visible: true}
  - {step: 11, owner: QM-053, input_state: installed final complete-success with receipt binding, success_state: receipt durable then optional observation then CAS cleanup intent cleanup ownership release and immutable release-marker install, failure_state: queue-owned receipt/canonical/marker classifier continues without event recovery and missing marker disables GC only, externally_visible: true}
result_taxonomy:
  - {result: rejected, disk_guarantee: no namespace I/O, memory_action: retain prior snapshot/generation, retry_rule: correct request or resnapshot, degraded_rule: no health transition or success observation}
  - {result: not_committed, disk_guarantee: intended namespace mutation definitely absent, memory_action: retain prior install/generation, retry_rule: bounded exact owner retry or reconcile before mutation, degraded_rule: infrastructure diagnostic; no success observation}
  - {result: committed_durable, disk_guarantee: selected namespace state parent-synced, memory_action: install selected state or release only at its higher-level durable cleanup landmark, retry_rule: continue only remaining queue-owned protocol, degraded_rule: event failure is diagnostic and does not refuse the name}
  - {result: commit_indeterminate, disk_guarantee: namespace mutation occurred but parent durability unresolved, memory_action: retain prior install and quarantine name, retry_rule: exact intent/canonical/temp/receipt reload-compare-sync only, degraded_rule: operator-visible infrastructure state until queue facts resolve}
cancel_wire_inventory:
  - {path: cmd/harmonik/main.go, symbol: queue cancel dispatch to queuecli.RunQueueCancel, transport: CLI to daemon queue-cancel RPC, daemon_state: reachable routes to target daemon, capability_behavior: unreachable returns exit 17 with no canonical/temp/archive/intent/legacy/receipt/event write}
  - {path: internal/queue/cli/cancel.go, symbol: RunQueueCancel tryDaemonQueueCancel cancelFindByID journalCancel emitQueueCancelEvent, transport: daemon socket client only after migration, daemon_state: unreachable fails closed, capability_behavior: preserve N-1 queue/force request; optional queue_id; remove local archive and event fallback}
  - {path: internal/daemon/socketdispatch.go, symbol: queue-cancel registration/dispatch, transport: target daemon RPC, daemon_state: live daemon required, capability_behavior: invokes only capability-owning HandlerAdapter}
  - {path: internal/queue/rpc.go, symbol: HandlerAdapter.HandleQueueCancel, transport: live QueueStore transaction, daemon_state: reachable owner process, capability_behavior: decode shipped queue/force plus optional queue_id; dual selectors must agree and neither is invalid; cancelled replacement plus archive intent then release and best-effort typed audit}
  - {path: internal/queue/persistence.go, symbol: CancelQueueOnShutdown, transport: graceful shutdown internal call, daemon_state: owner process shutting down, capability_behavior: durable cancel/archive protocol with no operator audit}
replace_intent:
  path_template: .harmonik/queues/<normalized-name>.replace-intent
  canonical_v1_fields: [schema_version, transaction_id, operation_kind, normalized_name, queue_id, canonical_basename, prior_state, candidate_sha256, candidate_temp_basename, wake_required, completion_receipt_binding, archive_handoff_binding]
  authority: queue_transaction_record
  covered_operations:
    - create submit append reservation Run-ID patch activation advance pause resume
    - eager refill budget review maintenance startup inline bootstrap crew placeholder
    - cancelled-state replacement before archive
  transaction_identity: canonical lowercase UUIDv7 transaction_id plus enumerated operation and normalized name/queue ID
  prior_identity: absent marker or SHA-256 over exact prior canonical bytes
  candidate_identity: SHA-256 over exact candidate canonical bytes and exact canonical basename
  temp_identity: unique already-durable sibling candidate temp basename fixed before intent
  pre_intent_order:
    - snapshot validate stale-generation check clone mutate validate
    - marshal exact canonical bytes and construct applicable normal-path event payload
    - create write fsync and close exact candidate temp
  wake_rule: Wake only after committed_durable install; repeatable after restart; never authority
  derived_event_rule: observational normal-path attempt only and not persisted or replayed by the intent
  response_replay: false
  cleanup_rule: ordinary success unlinks exact intent and queue-parent-syncs after canonical install/wake/observation; final and cancel keep it to their later cleanup boundary; unresolved intent continues ownership/refusal
  restart_rule: classify exact schema transaction prior candidate temp canonical and receipt facts by the exhaustive classifier below; JSONL is never consulted
  restart_classifier:
    - exact candidate canonical: sync parent then remove/sync ordinary intent
    - exact prior plus selected candidate temp: retry only selected canonical rename
    - exact prior or absence plus abandoned selected temp: remove only selected temp then remove/sync intent as not committed
    - exact prior or absence with no selected temp: remove/sync intent as not committed
    - third canonical changed digest wrong temp corrupt unsupported or mismatch: preserve all and refuse
    - definite intent-unlink failure retains refusal; unlink or parent-sync ambiguity reloads exact intent and syncs before release
  generation_rule: volatile process-local guard only and never restart identity
  cancellation_handoff:
    allocation_order: before cancelled candidate temp and predecessor replace-intent durability
    archive_origin: stable enum distinguishing operator-cancel graceful-shutdown inline-failure and recovery-corrupt
    archive_kind: cancelled failed or corrupt
    source_identity: exact queue ID or corrupt-source identity plus exact candidate/source digest
    destination_basename: one preselected non-overwriting archive basename never retimestamped on recovery
    successor_identity: one UUIDv7 plus exact canonical successor archive-intent bytes and SHA-256 digest bound in predecessor
    predecessor_retention: retain through successor create/write/fsync/close/rename and queue-parent fsync
    classifier: replace-only creates exact bound successor; exact linked pair continues; archive-only continues only after exact predecessor deletion; mismatch or originless cancelled canonical quarantines
    main_legacy_rule: successor archive intent remains until legacy absence is durable through .harmonik parent fsync
    successor_path: .harmonik/queues/<normalized-name>.archive-intent
    successor_v1_fields: [schema_version, archive_intent_id, predecessor_transaction_id, predecessor_intent_sha256, archive_origin, archive_kind, normalized_name, source_identity, source_sha256, destination_basename]
    install_rule: unique temp create/write/fsync/close then no-replace exact path and queue-parent fsync; exact bytes idempotent; mismatch preserved
    source_rule: parseable source uses exact canonical path plus queue ID and digest; corrupt source uses exact bound pathname and digest without parsing
    cleanup_classifier: predecessor-only creates prebound successor; exact pair syncs successor then unlinks/syncs predecessor; successor-only continues selected archive; archive and legacy durability precede successor unlink/root-sync; every rename/unlink/root-sync ambiguity reloads exact paths; release requires both intents durably absent
  final_completion_binding:
    required_status: complete-success
    allocation_order: preallocate receipt_id and exact canonical receipt bytes before completed canonical install and before durable replace intent
    receipt_id: one daemon-minted canonical lowercase UUIDv7 bound once
    receipt_schema_version: 1
    receipt_basename: <queue_id>--<receipt_id>.json fixed in the durable intent
    receipt_canonical_bytes_base64: base64 of the exact canonical receipt bytes fixed before intent durability
    receipt_canonical_bytes_digest: {algorithm: sha256, input_exact_bytes: receipt_canonical_bytes}
    retention_rule: keep intent through receipt durability and canonical unlink directory durability classification
    recovery_rule: reuse exact bound ID/basename/schema/bytes/digest; never mint reconstruct timestamp again or scan-select
  exclusions:
    - event ID effect key replay cursor or event payload delivery list
    - pending/acknowledged delivery state
    - RPC response
completion_receipt:
  owner: queue-model
  implementation_owner: CQ-RECEIPT
  path_template: .harmonik/queues/.completion-receipts/<queue_id>--<receipt_id>.json
  identity:
    queue_id: canonical lowercase UUIDv7 matching filename and completed canonical
    receipt_id: canonical lowercase UUIDv7 preallocated and intent-bound
    transaction_id: exact final replacement transaction UUIDv7
  canonical_binding:
    normalized_name: exact normalized canonical name
    final_group_index: final group nonnegative index
    final_status: complete-success
    success_count: final group durable success count
    fail_count: zero
    completed_at: one canonical timestamp fixed before intent durability
    completed_canonical_digest: {algorithm: sha256, input_exact_bytes: completed_canonical_bytes}
  namespace:
    layout: flat
    root_create_rule: mkdir; EEXIST succeeds only after opening and verifying expected directory; definite failure is not-created; ambiguity reloads before readiness
    root_parent_sync_rule: after first create open/fsync/close .harmonik/queues; successful fsync makes later close failure diagnostic
    file_install_rule: unique root temp create/write/fsync/close then no-replace rename; existing target accepted only for exact intent-bound canonical bytes; root open/fsync/close establishes durability
    no_per_queue_directory: true
  create_before_unlink: true
  cleanup_cas_rule: unlink canonical only when queue ID and SHA-256 of exact completed canonical bytes both match receipt binding
  missing_path_rule: absent canonical is idempotent cleanup success after queue-parent durability classification
  same_name_reuse_rule: different queue ID at the same name is a newer queue and is never touched; retained old receipt never blocks admission
  status_query:
    selector: queue_id
    live_lookup: exact live queue ID wins even when its name is shared by historical receipts
    watched_group_lookup: live exact-ID response includes exact watched group status/items/counts; missing group is integrity error
    watched_group_continuing_statuses: [pending, active]
    watched_group_success_status: complete-success
    watched_group_failure_status: complete-with-failures
    paused_or_cancelled_rule: paused-by-failure paused-by-drain or cancelled terminates waiter with exit 1 even when observations are absent
    receipt_fallback: after no exact live queue, accept exactly one unexpired identity-consistent receipt; zero is not found; multiple/corrupt/unsupported/disagreeing prefix candidates are identity-integrity error, never first-match
    receipt_group_proof_rule: receipt proves watched success only when final_group_index is at least watched index; lower index is integrity error
    same_name_rule: never fall through to or infer from a newer same-name live queue
    completed_response: status completed plus final_status/index/counts/completed_at/completion_receipt_id
    not_found_rule: accepted queue ID with no live queue and zero receipt candidates returns error/exit 1
    corrupt_or_unsupported_rule: matching-prefix corrupt unsupported multiple or filename/content/digest disagreement returns explicit identity-integrity error/exit 1
  observation:
    event: queue_group_completed
    completion_receipt_id_field: completion_receipt_id
    field_required_when: final_complete_success
    field_absent_when: [nonfinal_complete_success, complete_with_failures]
    mode: normal_path_single_attempt
    replay: never
    state_gate: false
    failure_action: diagnostic_only
    persistent_delivery_state: false
  retention:
    minimum_rule: retain through cleanup/ownership release and then at least 30 days
    authority: immutable completion-release marker v1; receipt completed_at filesystem times JSONL and process-local timers are forbidden
    marker_path_template: .harmonik/queues/.completion-receipts/<queue_id>--<receipt_id>.release-v1.json
    marker_schema:
      record_type: completion-release
      schema_version: 1
      binding: [queue_id, receipt_id, transaction_id, receipt_sha256, completed_queue_sha256]
      released_at: canonical UTC timestamp sampled only after durable canonical and intent absence plus QueueStore/refusal release
      gc_not_before: released_at plus exactly 720 hours
      immutable: true
    marker_install_rule: unique receipt-root temp create/write/fsync/close then no-replace rename to deterministic basename and receipt-root open/fsync/close; exact valid existing marker wins; different corrupt or unsupported marker is preserved and disables GC
