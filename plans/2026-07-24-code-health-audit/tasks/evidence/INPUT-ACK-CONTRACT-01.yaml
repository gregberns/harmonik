    - command: 'grep -rn "positive acceptance signal\|positive, per-input acceptance\|per-input acceptance signal" specs/*.md'
      result: 'One hit, in the agent-input revision-history row that describes the correction. No requirement body remains.'
  code_contradiction_check:
    command: 'grep -rn "Degraded" --include="*.go" internal/ cmd/; grep -rni "DeliveryOutcome|OutcomeAccepted" --include="*.go" internal/ cmd/'
    finding: >
      No contradiction. internal/handler/input_port.go already defines
      DeliveryOutcome as the binary {Delivered, Rejected} with a doc comment
      stating "Positive acceptance is NOT a DeliveryOutcome value; it is the
      async agent_input_acked event". No Accepted or Degraded ack outcome
      exists anywhere in internal/ or cmd/. Every "Degraded" hit is an unrelated
      identifier: DaemonDegradedPayload / DaemonDegradedReason / the
      daemon_degraded event type, and the keeper's Degraded bool on a
      clear-sent payload. Production code AGREES with the corrected specs and
      contradicted the pre-correction RSM-027.
  make_check_fast: recorded in the task report; no Go changed by this task

escalations:
  card_stop_conditions_triggered: none
  rationale: >
    No change was required to the Ack record, delivery outcomes, async event or
    timer semantics, event payloads, production behavior, or a locked decision.
    The amendment stays inside the leased prose.
  surfaced_owner_spec_tension:
    status: SURFACED, NOT RESOLVED HERE — needs an owner-spec decision, out of this lease
    where: specs/agent-input.md AIS-INV-001 and specs/handler-contract.md HC-INV-008
    contradiction: >
      Both invariants' HEADLINE sentence enumerates the terminal set as "an Ack
      (Delivered or Rejected) OR an emitted agent_input_stale event", which reads
      as Ack{Delivered} discharging the bounded window. Their BODIES say the
      opposite: the window is what bounds the wait for the Claude-hook-bridge
      positive signal, and "when no such hook signal arrives within the window,
      the driver MUST emit agent_input_stale". AIS-003 compounds it by having the
      interim tmux impl return Delivered immediately on a successful write, while
      AIS-001/HC-069 say SubmitInput "blocks until acked-or-stale". So the
      headline terminal set and the body disagree about whether Delivered ends
      the clock.
    pre_existing: >
      This tension landed in 045e937b5 (2026-07-15) and is untouched by this
      task's diff. It was surfaced by the independent review of this amendment,
      not created by it.
    why_not_fixed_here: >
      Resolving it means editing AIS-INV-001 / HC-INV-008 timer semantics, which
      the card's "Escalate when" clause forbids and which is outside the write
      lease (the lease covers only the five named front-stop restatements).
    mitigation_applied_in_lease:
      - >
        RSM-024's resume-seed bullet now cites AIS-003 + AIS-004 + AIS-INV-001 as
        the composite authority rather than AIS-INV-001 alone, so RSM no longer
        asserts a reading that the invariant's headline appears to deny.
      - >
        RSM-027's seam-ownership bullet now names the run-level backstop
        explicitly. A Delivered submission whose correlated async terminal never
        arrives is bounded by the ALREADY-composed RSM-024 timer stack (ready
        sub-bound, post_ready_hang, absolute commit-watchdog ceiling) routing to
        RSM-025. No second input timer is introduced and RSM-INV-001 stays
        bounded.
    corroboration: >
      The unlanded kerf draft .kerf/works/reviewloop-decoupling/05-spec-drafts/run-state-machine.md
      independently reached the same "Delivered, then a correlated async terminal"
      reading of RSM-024/RSM-027, citing the same AIS-003/AIS-004/AIS-INV-001
      triple. Two independent passes agree on the semantics.
    follow_up: bead hk-7rlmq (machine-local ledger) — reconcile the AIS-INV-001 / HC-INV-008 headline terminal set with their own bodies.

