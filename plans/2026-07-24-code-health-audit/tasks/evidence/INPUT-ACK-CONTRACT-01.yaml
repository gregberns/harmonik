    - observation: Ack{Delivered}
      route: await the correlated asynchronous terminal
    - observation: Ack{Rejected}
      route: fail closed (RSM-025)
    - observation: agent_input_acked (correlated)
      route: acceptance path
    - observation: agent_input_stale (correlated)
      route: fail closed (RSM-025)
  greps:
    - command: 'grep -n "Accepted\|Degraded\|three-valued\|acceptance class\|acceptance tier" specs/run-state-machine.md'
      result: >
        Two hits, both intentional and non-normative-as-a-live-outcome: RSM-027's
        explicit negative sentence ("There is no Accepted and no Degraded
        outcome, and no acceptance class or tier") and the §14 revision-history
