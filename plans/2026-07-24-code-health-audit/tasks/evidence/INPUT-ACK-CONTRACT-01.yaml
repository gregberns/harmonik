sites_changed:
  - spec: specs/run-state-machine.md
    requirement: RSM-027
    before: >
      "The reactor MUST honour the three-valued acceptance class of Ack
      (AIS-003): Accepted (positively confirmed) MUST advance the dispatch;
      Rejected MUST route to the fail-closed liveness edge; Degraded (written
      but not positively confirmed) MUST NOT be treated as confirmation …"
      plus a bullet routing "a stale (or Rejected, or never-confirmed
      Degraded) resume seed" to the fail-closed edge.
    after: >
      Binary outcome honoured: Ack{Delivered} records driver handoff and leaves
      positive acceptance PENDING; Ack{Rejected} fail-closes to RSM-025. A new
      bullet makes the correlated async events the acceptance verdict
      (agent_input_acked = acceptance path; agent_input_stale = fail closed)
      and states the four routes as TOTAL. The correlation bullet spells out
      the input_seq consumption rule (first synchronous outcome consumed once;
      after Delivered the first correlated async terminal wins; drop only
      repeated or late observations; never drop the first agent_input_acked).
      The seam-ownership bullet adds "MUST NOT add a second input timer".
      Accepted, Degraded, and "three-valued acceptance class" are gone.
    renumbered: false
  - spec: specs/run-state-machine.md
    requirement: RSM-024
    before: >
      "…the agent-input output-or-stale bound on the resume seed (§9), which
      resolves the seed submission to an Ack or an agent_input_stale terminal
      within the agent-input bounded window …"
    after: >
      "…resolves the seed submission … to Ack{Rejected}, or to Ack{Delivered}
      followed by its correlated agent_input_acked or agent_input_stale — a
      Delivered return alone does NOT resolve the seed, because it is a
      delivery handoff and not positive acceptance."
    renumbered: false
  - spec: specs/agent-input.md
    requirement: "§3 glossary — front-stop"
    before: 'the synchronous Ack is an *earlier* positive acceptance signal placed IN FRONT of the pre-existing async watchdogs'
    after: 'the synchronous Ack is an *earlier* delivery-handoff observation placed IN FRONT of the pre-existing async watchdogs … It is not positive acceptance: that is the async agent_input_acked event (AIS-003, AIS-004).'
  - spec: specs/agent-input.md
    requirement: AIS-005
    before: 'The synchronous Ack MUST be an earlier positive acceptance signal placed IN FRONT of the pre-existing async watchdogs'
    after: 'The synchronous Ack MUST be an earlier delivery-handoff observation placed IN FRONT of the pre-existing async watchdogs … Ack{Delivered} is NOT positive acceptance — positive acceptance is the async agent_input_acked event (AIS-003, AIS-004), and its absence within the bounded window reaches agent_input_stale (AIS-INV-001).'
    rule_preserved: composes in front of, and does not remove or weaken, agent_heartbeat / commit-poll
  - spec: specs/handler-contract.md
    requirement: HC-070
    before: 'The synchronous input ack is an earlier, positive, per-input acceptance signal that composes in front of the existing process-liveness signals.'
    after: 'The synchronous input ack is an earlier, per-input delivery-handoff observation that composes in front of the existing process-liveness signals; it is NOT positive acceptance — that is the async agent_input_acked event above.'
    rule_preserved: does not gate first-work dispatch; does not replace heartbeat / commit watchdogs
  - spec: specs/handler-contract.md
    requirement: HC-056
    before: 'composes in front of this timeout as an earlier, positive, per-input acceptance signal'
    after: 'composes in front of this timeout as an earlier, per-input delivery-handoff observation — NOT positive acceptance, which is the async agent_input_acked event per HC-070'
    rule_preserved: does not replace or satisfy the agent_ready gate (HC-INV-004)
  - spec: specs/handler-contract.md
    requirement: HC-057
    before: 'is an earlier, per-input acceptance signal that composes in front of this heartbeat watchdog'
    after: 'is an earlier, per-input delivery-handoff observation — NOT positive acceptance, which is the async agent_input_acked event per HC-070 — that composes in front of this heartbeat watchdog'
    rule_preserved: does not replace the heartbeat / silent-hang liveness guard (§7.1)

