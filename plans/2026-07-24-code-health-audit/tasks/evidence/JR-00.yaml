local_vs_primary_proof:
  deterministic_without_primary_daemon:
    - "YAML source trace, pure runexec transitions, QueueStore locking, queue atomic persistence implementation, and adapter call ordering."
    - "Controlled startup reconciliation and independent-session adoption scenarios using temporary project state and fakes."
    - "Targeted Go tests can validate selected disputed paths without launching the primary daemon."
  runtime_proof_remaining:
    - "Actual primary-daemon crash timing across Beads CLI, JSONL fsync/append, queue rename/fsync, tmux session creation, and process launch cannot be proven by source alone."
    - "This is deferred runtime proof, not a failed local assertion; the mission forbids starting or restarting the primary daemon."
contradictions:
  - source: "specs/queue-model.md describes ItemStatusDispatched as having populated run_id"
    implementation: "runWorkLoop persists dispatched with an empty-string RunID placeholder, then separately patches the real UUID and persists again."
    impact: "There is a durable intermediate state that is not a fully populated dispatch identity; restart recovery must treat queue state and Bead state as authoritative rather than relying on Item.RunID."
  - source: "specs/queue-model.md QM-002a prose says queue dispatched can coexist with failed claim write"
    implementation: "runWorkLoop stamps queue before ClaimBead, so the observed recoverable mismatch is queue dispatched plus Bead open when claim never landed or was reset; source comments call it claim-write-lost."
    impact: "The factual current behavior is still describable, but the prose's causal wording does not match the production ordering."
  - source: "specs/queue-model.md QM-051/QM-053 require final queue_group_completed before final queue unlink; internal/queue/persistence.go also states its caller must already have emitted the event"
    implementation: "internal/daemon/workloop.go evaluateGroupAdvanceWithOutcome calls queue.CompleteAndUnlink before emitting the events returned by queue.AdvanceGroup."
    impact: "A crash after unlink and before the later emit can lose the specified final durable completion landmark."
ownership_gaps:
  - "No atomic transaction spans queue item terminal persistence, Bead close/reopen, JSONL terminal event, and run-record deletion. Recovery reconciles evidence after a crash."
  - "RunRegistry is the capacity owner but is memory-only; it cannot establish a restarted Run's ownership."
  - "run_started lacks item_index and queue_name; event-only repair must infer the specific queue item through other state."
  - "A failed queue.Persist after dispatch stamp, RunID patch, claim revert, or terminal advance is logged and allowed to continue; no immediate fail-closed owner was found."
  - "Shared-session and remote runs have no mandatory durable process/session record comparable to independent local tmux records."
  - "The startup event-log orphan pass does not exclude live independent-session records before it resets an orphaned run_started; this can release a queue/Bead while the old tmux session continues."
  - "Run session registry writes/removals are rename/delete only and omit file/parent-directory fsync."
downstream_task_impacts:
  - task: JR-01
    finding: "Extracting claim/Run preparation must preserve the explicit stamp -> RunID patch -> ClaimBead -> Register ordering and document the empty RunID placeholder crash cut."
    recommended_clarification: "Acceptance should require a fault-injected proof for each pre-launch cut and name dispatch-tracker recovery as the owner for claim-success/no-run cases."
  - task: JR-02
    finding: "Run terminal decision is in runexec/RunBridge while queue release is in the outer goroutine; terminal effects are split across ledger, event bus, queue, and run-record cleanup."
    recommended_clarification: "Acceptance should preserve the current Run-machine-versus-adapter boundary and explicitly test queue-terminal persistence after each close/reopen outcome."
  - task: JR-03
    finding: "Restart recovery has three sources (runs record, JSONL, raw dispatch tracker), but the JSONL run_started-minus-terminal pass can reset a Bead for a still-live independent session before the live-record monitor adopts it."
    recommended_clarification: "Lease should include recovery source precedence, a live-record exclusion before event-log reset, and a combined-path proof; do not replace it with a single inferred Run record contract without a migration."
  - task: JR-04
    finding: "Terminal disagreement remains possible after Bead terminal effect and before queue persistence; current repair is evidence-driven rather than transactional."
    recommended_clarification: "Acceptance should define which durable fact is authoritative at each terminal crash cut and require replay/idempotency proof."
  - task: ARCH-01
    finding: "Final queue completion currently unlinks before emitting the spec-designated final queue_group_completed landmark."
    recommended_clarification: "Contract must settle persist/emit/unlink ordering and recovery semantics; the evidence identifies a current source/spec contradiction, not a proposed architecture."
  - task: BR-00
    finding: "Run identity is created before claim but only conditionally durable as a run record; launch plan extraction must not assume all runs possess a durable Run record."
    recommended_clarification: "Model the independent-session record as optional recovery metadata, distinct from queue Item.RunID and JSONL evidence."
  - task: ARCH-01
    finding: "Current ownership is intentionally split across workloop, RunBridge/runexec, queue persistence, and startup reconcilers."
    recommended_clarification: "Architecture contract should distinguish decision owner, side-effect owner, serialization owner, and recovery owner rather than claiming one Run owner."
