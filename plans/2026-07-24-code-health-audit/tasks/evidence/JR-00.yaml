    owner: "daemon.adoptDeadRunSessions"
    mechanism: "ResetBead and remove record before queue load; QM-002a observes open and returns queue pending"
  - path: "durable independent record, session survives"
    owner: "conflicting: startup reconcileOrphanedRunsOnResume and later runWorkLoop adoptLiveRunSession"
    mechanism: "adoptLiveRunSession monitors a live session and on disappearance reopens Bead, sets queue dispatched to pending, clears RunID, persists, wakes, and removes record. However the preceding run_started-minus-terminal reconciliation does not exclude live records and can reset/release a live session first."
  - path: "terminal event but dispatch lock survives"
    owner: "reconcileOrphanedRunsOnResume terminated-but-locked pass"
    mechanism: "derive terminal bead IDs from JSONL, skip live/dispatched duplicates, guarded ResetBead"
