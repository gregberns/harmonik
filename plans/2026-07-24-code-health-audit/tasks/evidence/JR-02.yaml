    class: transient
    sub_reason: claude_server_error
    status: preexisting_covered
    proof: TestMapWaitReturn_FailureSignal_AgentFailed
  - input: "Outcome.Kind=FAILURE_SIGNAL, class empty, sub_reason empty"
    terminal_type: agent_failed
    class: structural
    sub_reason: claude_failure
    status: characterization_added
    proof: TestMapWaitReturn_FailureSignal_EmptyFieldsUseStructuralDefaults
  - input: "nil outcome, exit=0, waitErr=nil"
    terminal_type: agent_failed
    class: structural
    sub_reason: claude_exit_without_outcome
    status: preexisting_covered
    proof: TestMapWaitReturn_NoOutcome_CleanExit_ExitWithoutOutcome
  - input: "nil outcome, exit=1, waitErr non-nil"
    terminal_type: agent_failed
    class: structural
    sub_reason: claude_crashed
    status: preexisting_covered
    proof: TestMapWaitReturn_NoOutcome_NonZeroExit_Crashed
  - input: "unknown nonempty Outcome.Kind, exit=0, waitErr=nil"
    terminal_type: agent_failed
    class: structural
    sub_reason: claude_exit_without_outcome
    status: current_fallthrough_characterized_not_policy
    proof: TestMapWaitReturn_UnknownOutcomeKind_UsesNoRecognizedOutcomeFallback
