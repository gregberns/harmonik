  - input: "Outcome.Kind=REVIEWER_VERDICT"
    terminal_type: agent_completed
    status: preexisting_covered
    proof: TestMapWaitReturn_ReviewerVerdict_AgentCompleted
  - input: "Outcome.Kind=FAILURE_SIGNAL, class=transient, sub_reason=claude_server_error"
