methodology:
  ancestry: >-
    Exact merge-base --is-ancestor checks were run for every known atom against
    the analysis base, integration candidate, and reviewloop branch. Blob IDs
    were compared where source identity matters.
  production_caller_search: >-
    Non-test Go imports and qualified API uses were searched on the pinned
    integration candidate. Direct owned-API callers were separated from legacy
    compatibility methods whose implementation delegates to the owned API.
  dependency_census: >-
    The R0 go/types ratchet resolves identifiers and selector members to their
    declaring daemon objects. The three pinned committed trees carry the same
    reviewloop.go blob c844ce0ad00f7f312aa7a7f304f59f91af5153dc.
    Focused R0 census tests pass on both staged refs. The staged typed test and
    a temporary external logging test were overlaid read-only onto the analysis
    worktree; that probe emitted the exact 26/48 analysis-base map shown below.
    The temporary files were removed. All six census inputs are byte-identical
    across the analysis, integration, and reviewloop refs, so the exact map
    transports to both staged refs; their stock ceiling tests also pass. The
    preserved L8 snapshot cannot type-check, so its direct undefined identifiers
    were enumerated with compiler -e and reconciled with the typed map.
  equivalence_standard: >-
    Equivalent means identical production symbol behavior, production
    reachability, and focused proof, not merely a similar name or later plan.
    No R4-R12 analysis-base implementation met that standard.

