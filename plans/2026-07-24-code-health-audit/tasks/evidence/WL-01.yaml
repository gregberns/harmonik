    preconditions: [active queue item, claimable bead]
    required_trace: [source.queue.select, queue.reservation.durable, ledger.claim, registry.register, executor.started, executor.terminal.success, queue.item_terminal.success, registry.unregister]
    forbidden_effects: [source.br_ready.ready]
    classification: invariant
    proof: [TestWL01_QueueSuccessProductionTrace, TestWL01_OracleRejectsReorderedReservation, TestWL01_OracleRejectsDuplicateClaimCompensation]
  - id: br_ready_success
    preconditions: [no loaded queue, ready open bead]
    required_trace: [source.br_ready.ready, source.br_ready.show, ledger.claim, registry.register, executor.started, executor.terminal.success, ledger.close, registry.unregister]
    forbidden_effects: [source.queue.select, queue.reservation.durable]
    classification: invariant
    proof: [TestWL01_BRReadySuccessProductionTrace]
  - id: loaded_queue_suppresses_br_ready
    preconditions: [loaded queue has no eligible item]
