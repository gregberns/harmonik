gaps:
  - loaded_queue_suppresses_br_ready: ExportedRunWorkLoop exposes no reached-idle rendezvous; a wake can be consumed before the loaded-queue idle branch, so a no-Ready observation would be scheduler-dependent. Downstream closure owner is WL-03.
  - idle_submit_wake: QueueStore exposes a wake channel but the production idle branch has no entered-wait acknowledgment; the existing seam cannot prove blocked-then-woken ordering without a timing assertion. Downstream closure owner is WL-03.
  - operator_pause_br_ready: OperatorPauseController similarly has no gate-entered acknowledgment through ExportedRunWorkLoop; a pre-cancel no-Ready check can race before the loop evaluates pause. Downstream closure owner is WL-02B.
  - capacity_gate: RunRegistry capacity has no reached-capacity-gate acknowledgment, so no-source assertions would freeze scheduler timing. Downstream closure owner is WL-02B.
  - shutdown_inflight: the existing exported work-loop construction seam has no deterministic executor-start barrier that also distinguishes cancelled terminalization from the normal terminal event. Downstream closure owner is WL-04.
  - restart_spawn_gate: SpawnSubstrateReadyCh blocks the loop but supplies no production-side entered-wait acknowledgment; closing it immediately cannot prove the goroutine reached the gate first. Downstream closure owner is WL-REC-01.
  - restart_live_session: live-session adoption requires an unexported substrate adapter extraction path and a fixed ticker; no allowed exported construction seam exposes a deterministic monitor tick barrier. Downstream closure owner is WL-REC-01.
  - reservation_persist_failure is observed debt: production logs persistence failure and still reaches ClaimBead; the trace intentionally forbids queue.reservation.durable and makes no normative continuation claim.
