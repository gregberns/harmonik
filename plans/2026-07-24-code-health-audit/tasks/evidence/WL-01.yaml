construction:
  production_entry: daemon.ExportedRunWorkLoop
  controlled_adapter: wl01Ledger records only Ready, ShowBead, ClaimBead, CloseBead, and ReopenBead boundaries; its retry ShowBead barriers observe state after production failure handling and return caller cancellation when released, bounding each trace to one attempt.
  overrides:
    - BrAdapter: wl01Ledger; isolates ledger effects, validates the claim boundary, and supplies deterministic observation barriers only.
    - Bus: wl01EventEmitter; maps real RunStarted, QueueItemHeldForHandlerPause, and DiskLow production events to semantic trace observations.
    - ProjectDir: per-test temporary git fixture; preserves production queue and worktree behavior without persistent artifacts.
    - HandlerBinary: /usr/bin/true; deterministic terminal process for production terminal-path checks.
    - IntentLogDir: test temporary directory; avoids persistent intent artifacts.
    - AdapterRegistry2: sealed empty test registry; satisfies the existing production precondition.
    - RunRegistry: per-test production registry where registration and cleanup are observed.
    - QueueStore: production queue store for queue-success, claim-failure, and handler-pause scenarios; default nil store for br-ready and disk-low scenarios.
    - WorktreeFactory: emptyCommitWorktreeFactory wraps the production worktree factory for successful terminal-path scenarios.
    - CancelOnQueueDrain: queue-success-only completion hook that ends the loop after production terminal advancement.
    - HandlerPauseController: production controller paused for the handler gate scenario.
    - DiskFreeBytesFunc and GoCacheCleanFunc: disk-low-only maintenance inputs; the asserted hold is the real DiskLow event.
    - all other ExportedWorkLoopDeps parameters: production test-seam defaults.
